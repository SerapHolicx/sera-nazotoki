<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>宵空天文台 | 星あつめ</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#15172c;color:#f4f0ff;font-family:monospace}body{min-height:100vh;background:repeating-linear-gradient(0deg,#15172c 0 5px,#181a32 5px 10px)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff}#wrap{max-width:680px;margin:auto;padding:10px}.panel{border:4px solid #fff1bd;box-shadow:inset 0 0 0 4px #4c496f,5px 5px 0 #080c1e;background:#292846;margin-bottom:13px}.top{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.title{font-weight:900;color:#ffe4a5;letter-spacing:2px}.small{font-size:12px;color:#c7c2db}.pill{border:2px solid #b2a7d8;background:#44446d;color:#fff;padding:5px 9px}.scene{position:relative;border:4px solid #f3dca5;background:#232544;overflow:hidden;image-rendering:pixelated}canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}.portrait{position:absolute;bottom:7px;right:8px;width:88px;height:94px;object-fit:cover;object-position:center top;image-rendering:pixelated;border:3px solid #fff0c0;background:#57506f}.eye-star{position:absolute;right:38px;bottom:54px;font-size:19px;line-height:1;cursor:grab;touch-action:none;filter:drop-shadow(0 0 3px #fff);z-index:4}.eye-star.used{display:none}.dialog{padding:11px 13px;min-height:78px;font-size:14px;line-height:1.65;background:#302d50}.dialog strong{color:#ffe6b5}.controls{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px);gap:3px}.key,.act{background:#676195;color:white;border:3px solid #f5d7ad;box-shadow:3px 3px 0 #15152d;min-height:43px}.key:active,.act:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #15152d}.key.up{grid-column:2}.key.left{grid-column:1;grid-row:2}.key.down{grid-column:2;grid-row:2}.key.right{grid-column:3;grid-row:2}.act{padding:8px 14px}.hud{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px}.star{color:#ffe59a;font-size:22px;letter-spacing:3px}.dim{opacity:.25}.overlay{position:fixed;inset:0;background:#080a1edb;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.overlay.show{display:flex}.box{width:min(100%,520px);max-height:90vh;overflow:auto;padding:18px;background:#292846;border:5px solid #f6e3b9;box-shadow:8px 8px 0 #08091c}.box h2{margin:0 0 12px;color:#ffe4a5;font-size:19px}.box p{line-height:1.75}.answer{width:100%;padding:11px;color:#201e3a;background:#fff8e7;border:3px solid #c8b1db;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:24px;color:#ffe1b2}.constellation{position:relative;height:290px;border:3px solid #807da8;background:radial-gradient(circle at 50% 35%,#343b72,#12162d 70%);overflow:hidden;touch-action:none}.target{position:absolute;width:38px;height:38px;border:2px dashed #8986b5;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;color:#aaa}.placed{position:absolute;width:38px;height:38px;transform:translate(-50%,-50%);border:0;background:none;color:#ffe4a2;font-size:30px;filter:drop-shadow(0 0 6px #fff1a0);touch-action:none}.constellation svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.bookrow{display:block;width:100%;text-align:left;margin:7px 0;padding:10px;background:#4b466e;color:#fff;border:2px solid #c2b2da}.hint{font-size:12px;color:#d4cfe4}.night #wrap{filter:saturate(.72)}.night .scene{border-color:#8e9cb9}.dev{font-size:11px;opacity:.8}.meteor{position:absolute;top:26%;left:75%;font-size:34px;z-index:8;cursor:grab;touch-action:none;animation:glow 1s infinite alternate}.meteor.hidden{display:none}@keyframes glow{to{filter:drop-shadow(0 0 12px #fff);transform:translate(-6px,5px)}}.end{font-size:20px;text-align:center;color:#ffe9bc}.foot{text-align:center;color:#a4a0c2;font-size:11px;padding:8px}@media(max-width:370px){.portrait{width:70px;height:76px}.eye-sta </style></head><body><div id="wrap"><div class="panel top"><div><div class="title">✦ よいぞら てんもんだい ✦</div><div class="small">ちいさな星のものがたり</div></div><button class="pill" id="reset">はじめから</button></div><div class="panel hud"><span>ほし</span><span id="stars" class="star">☆☆☆☆☆☆</span><button class="pill" id="log">きろく</button><button class="pill" id="sky">よぞら</button></div><div class="scene" id="scene"><canvas id="game" width="320" height="252" aria-label="天文台の見下ろしマップ。方向キーで移動できます"></canvas><img id="portrait" class="portrait" src="sera_normal.png" alt="ウインクしたセラ"><span id="eye" class="eye-star" role="button" tabindex="0" aria-label="セラの瞳の星">✦</span><span id="meteor" class="meteor hidden" role="button" tabindex="0" aria-label="流れ星">🌠</span></div><div class="panel dialog" id="dialog"><strong>セラ</strong>「この天文台に、星が散らばっちゃったみたい。いっしょに見てまわろう？」</div><div class="panel controls"><div class="dpad"><button class="key up" data-dir="up">▲</button><button class="key left" data-dir="left">◀</button><button class="key down" data-dir="down">▼</button><button class="key right" data-dir="right">▶</button></div><div><button class="act" id="inspect">しらべる ✦</button><br><button class="pill dev" id="dev" style="margin-top:10px">DEV 🌠 流れ星</button></div></div><div class="foot">移動：十字キー／マップをタップ　調べる：近づいて「しらべる」</div></div><div class="overlay" id="overlay"><div class="box"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="row" id="modalActions"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),objects=[{id:'books',x:51,y:57,label:'ほんだな',q:0},{id:'desk',x:153,y:66,label:'つくえ',q:1},{id:'clock',x:267,y:50,label:'とけい',q:2},{id:'telescope',x:264,y:147,label:'ぼうえんきょう',q:3},{id:'window',x:65,y:152,label:'まど',q:4},{id:'door',x:157,y:215,label:'とびら',q:-1}];const puzzles=[{title:'ほんだなのメモ',body:'「あさ」の反対は？　ひらがな2文字。',answers:['よる']},{title:'つくえの手紙',body:'「ほし」の最初の文字を、ひらがなで入力してね。',answers:['ほ']},{title:'とけいの文字盤',body:'時計の短い針が12、長い針も12を指している。何時？　数字で。',answers:['12','１２']},{title:'ぼうえんきょうの札',body:'夜空で光る、月ではない小さな点は？　ひらがな2文字。',answers:['ほし']},{title:'まどのスケッチ',body:'この形は何に見える？「か」から始まる2文字。<div style="font-size:30px;text-align:center;letter-spacing:6px">✦◇<br>　╲✦━✦</div>',answers:['かぎ']}];let s={x:157,y:151,solved:[],eyeTaken:false,skyDone:false,restored:false,found:[],meteor:false};try{const old=JSON.parse(localStorage.getItem('sera_rpg_v1'));if(old&&typeof old==='object')s={...s,...old}}catch(e){}const save=()=>{try{localStorage.setItem('sera_rpg_v1',JSON.stringify(s))}catch(e){}};let message='',open=false,drag=null;function say(t){$('dialog').innerHTML=t}function modal(title,html,actions=[]){open=true;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalActions').replaceChildren();actions.push(['とじる',close]);for(const [label,fn] of actions){const b=document.createElement('button');b.className='act';b.textContent=label;b.addEventListener('click',fn);$('modalActions').append(b)}$('overlay').classList.add('show')}function close(){open=false;$('overlay').classList.remove('show');draw()}function update(){let n=s.solved.length+(s.eyeTaken?1:0);$('stars').innerHTML='★'.repeat(Math.min(n,6))+'<span class="dim">☆'.repeat(Math.max(0,6-n))+'</span>';$('portrait').src=s.eyeTaken&&!s.restored?'sera_lost.png':'sera_normal.png';$('eye').classList.toggle('used',s.eyeTaken&&!s.restored);document.body.classList.toggle('night',s.skyDone&&!s.restored);$('meteor').classList.toggle('hidden',!s.meteor||s.restored)}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)}function text(t,x,y,c='#f7e5c5',size=8){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(t,x,y)}function draw(){update();ctx.imageSmoothingEnabled=false;rect(0,0,320,252,s.skyDone?'#222942':'#a1a0c9');for(let y=0;y<252;y+=16)for(let x=0;x<320;x+=16)rect(x+1,y+1,14,14,s.skyDone?((x+y)%32?'#353955':'#30354e'):((x+y)%32?'#c5bbd6':'#b8add0'));rect(0,0,320,21,s.skyDone?'#1b213b':'#7676a6');for(let x=0;x<320;x+=32)rect(x+4,8,8,4,'#f5d6b0'); // window and shelves
rect(25,28,60,52,'#514c7a');rect(29,31,52,45,'#8a6a88');for(let i=0;i<4;i++){rect(33,37+i*9,44,4,'#d8b993');for(let j=0;j<4;j++)rect(35+j*10,31+i*9,5,9,['#c8c5e3','#f0bd9c','#a9d6d2'][j%3])}text('ほん',55,91);rect(115,46,81,47,'#5d527a');rect(120,52,71,32,'#c39eb1');rect(139,57,28,17,'#f8e3bc');text('つくえ',155,105);rect(245,27,47,45,'#6e6590');rect(251,31,35,35,'#efe3c8');rect(266,47,2,17,'#655b88');rect(267,47,12,2,'#655b88');text('とけい',267,83);rect(238,125,53,37,'#555273');rect(245,127,40,24,'#b4d5e6');rect(253,132,28,12,'#4c638d');text('ぼうえんきょう',263,175, '#f7e5c5',7);rect(27,126,76,47,'#615b86');rect(33,130,64,38,s.skyDone?'#171e40':'#6277a4');for(let i=0;i<7;i++)rect(38+(i*19)%55,134+(i*13)%29,2,2,'#fff2b7');text('まど',65,184);rect(128,204,59,44,'#52476e');rect(136,209,43,37,s.skyDone?'#9b9ac3':'#71658e');rect(169,225,4,4,'#ffe1a0');text('でぐち',157,200);if(s.skyDone){rect(113,110,94,27,'#262e52');text('✦   ✦   ✦',160,128,'#b8b6dc',12)}else{text('✦  ✦  ✦',160,128,'#fff3c1',12)} // player
rect(s.x-6,s.y-13,12,10,'#c7c1e6');rect(s.x-8,s.y-9,16,8,'#a3b7e7');rect(s.x-6,s.y-3,12,9,'#fff0f4');rect(s.x-5,s.y+6,4,4,'#574c7e');rect(s.x+2,s.y+6,4,4,'#574c7e');rect(s.x-4,s.y-8,2,2,'#454165');rect(s.x+2,s.y-8,2,2,'#454165');text('セラ',s.x,s.y-18,'#fff8e5',8)}function near(o){return Math.hypot(o.x-s.x,o.y-s.y)<48}function inspect(o){if(!o){o=objects.filter(near).sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y))[0]}if(!o){say('<strong>セラ</strong>「気になるものに、もう少し近づいてみよう。」');return}if(o.id==='door'){say('<strong>セラ</strong>「もう少し、ここにいたいな。」');return}if(s.skyDone){explore(o);return}if(s.solved.includes(o.q)){say(`<strong>セラ</strong>「${o.label}はもう調べたね。きろくから見返せるよ。」`);return}const q=puzzles[o.q];modal(q.title,`<p>${q.body}</p><input class="answer" id="answer" placeholder="こたえ" autocomplete="off"><div class="msg" id="feedback"></div>`,[['こたえる',()=>{const v=($('answer').value||'').trim().replace(/\s/g,'').toLowerCase();if(q.answers.includes(v)){s.solved.push(o.q);save();close();say(`<strong>セラ</strong>「やった！ 星をひとつ見つけたよ。 ★」`);draw();if(s.solved.length===5)setTimeout(()=>say('<strong>セラ</strong>「ぜんぶ見つけたね。……あれ？」'),900)}else $('feedback').textContent='ちがうみたい。もう一度考えてみよう。'}]])}function explore(o){if(!s.found.includes(o.id)){s.found.push(o.id);save()}const info={books:['古い天文図鑑','「星は、見上げる人がいて初めて星座になる。」ページの端に流れる光の絵がある。'],desk:['書きかけの手紙','「きれいな星座ができたら、君といっしょに見たかったんだ。」最後の一行だけ、インクがにじんでいる。'],clock:['止まった時計','短い針も長い針も、真上を指している。文字盤の裏に小さく「日付の境目」と刻まれている。'],telescope:['観測ノート','「流星は一日に一度。日付が切り替わる瞬間、天文台の空を横切る。」'],window:['窓の向こう','星座はそこにある。でも、セラの目には光がない。'],door:['天文台の扉','外は静かな夜。今はまだ、ここにいたい。']};const [title,body]=info[o.id];modal(title,`<p>${body}</p>`);if(o.id==='telescope'&&s.found.includes('clock'))say('<strong>セラ</strong>「……いつか、もう一度。」')}function move(dx,dy){if(open)return;s.x=Math.max(14,Math.min(305,s.x+dx));s.y=Math.max(104,Math.min(194,s.y+dy));save();draw()}document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.dir;move(d==='left'?-12:d==='right'?12:0,d==='up'?-12:d==='down'?12:0)}));$('inspect').addEventListener('click',()=>inspect());canvas.addEventListener('click',e=>{if(open)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*320/r.width,y=(e.clientY-r.top)*252/r.height;const o=objects.find(o=>Math.hypot(o.x-x,o.y-y)<28);if(o){s.x=Math.max(14,Math.min(305,o.x));s.y=Math.max(104,Math.min(194,o.y+22));draw();inspect(o)}else{s.x=Math.max(14,Math.min(305,x));s.y=Math.max(104,Math.min(194,y));save();draw()}});document.addEventListener('keydown',e=>{if(open||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const d={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(d){e.preventDefault();move(...d)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect()}});$('log').addEventListener('click',()=>{let html='<p>みつけた きろく</p>';puzzles.forEach((p,i)=>{html+=`<button class="bookrow" data-q="${i}" ${s.solved.includes(i)?'':'disabled'}>${s.solved.includes(i)?'★':'☆'} ${p.title}</button>`});modal('ぼうけんのきろく',html);document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{const q=puzzles[+b.dataset.q];modal(q.title,`<p>${q.body}</p><p class="hint">こたえ：${q.answers[0]}</p>`)}))});
const points=[[45,20],[27,43],[63,43],[45,66],[67,79],[87,79]];function sky(){const n=s.solved.length+(s.eyeTaken?1:0);let html=`<p class="hint">星をタップして、夜空に置いてみよう。</p><div class="constellation" id="constellation"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M45 20 L27 43 L45 66 L63 43 L45 20 M45 66 L67 79 L87 79" fill="none" stroke="#5d6393" stroke-width=".8" stroke-dasharray="2 2" opacity=".55"/></svg>`;for(let i=0;i<6;i++)html+=`<button class="target" data-slot="${i}" style="left:${points[i][0]}%;top:${points[i][1]}%" aria-label="星の場所${i+1}">${s.skyDone||i<n?'☆':'·'}</button>`;html+='</div><p id="skymsg" class="msg"></p>';modal('よぞら',html,[['星座をながめる',()=>{if(s.skyDone){close();return}if(n<6){$('skymsg').textContent='まだ星が足りないみたい。';return}if(placed.size<6){$('skymsg').textContent='星がまだ並んでいないみたい。';return}s.skyDone=true;save();close();say('<strong>セラ</strong>「……きれいに、できた？」');draw()}]]);document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.slot;if(i>=n)return;placed.add(i);b.textContent='★';b.style.color='#ffe5a1';if(placed.size===6)$('skymsg').textContent='星たちが、ひとつの形になった。'}))}let placed=new Set();$('sky').addEventListener('click',sky);
function takeEye(){if(s.eyeTaken||s.solved.length<5){say('<strong>セラ</strong>「……？」');return}s.eyeTaken=true;save();draw();say('<strong>セラ</strong>「……あれ？　なんだか、少し暗いね。」');}const eye=$('eye');eye.addEventListener('click',takeEye);eye.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();takeEye()}});eye.addEventListener('pointerdown',e=>{drag={kind:'eye',x:e.clientX,y:e.clientY};eye.setPointerCapture(e.pointerId)});eye.addEventListener('pointerup',e=>{if(drag?.kind==='eye'&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>25)takeEye();drag=null});function spawn(){if(!s.skyDone||s.restored){say('<strong>セラ</strong>「まだ、夜空は静かだね。」');return}s.meteor=true;save();draw();say('<strong>セラ</strong>「……いま、光った？」')}$('dev').addEventListener('click',spawn);const met=$('meteor');function restore(){if(!s.meteor)return;s.restored=true;s.meteor=false;save();draw();modal('✦ TRUE END ✦','<p class="end">「君と一緒に星座を見たかったんだ。」</p><p>瞳に光が戻った。夜空には、ふたりで作った星座が輝いている。</p><p class="hint">エンディング曲：『星座になれたら』</p>',[['歌ってみたをひらく',()=>{window.open('https://www.youtube.com/watch?v=1Kkv-2aYqKk','_blank','noopener')}]]);say('<strong>セラ</strong>「君と一緒に星座を見たかったんだ。」')}met.addEventListener('click',restore);met.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();restore()}});met.addEventListener('pointerdown',e=>{drag={kind:'meteor',x:e.clientX,y:e.clientY};met.setPointerCapture(e.pointerId)});met.addEventListener('pointerup',e=>{if(drag?.kind==='meteor'&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>25)restore();drag=null});$('reset').addEventListener('click',()=>{if(!confirm('最初からやり直す？'))return;try{localStorage.removeItem('sera_rpg_v1')}catch(e){}location.reload()});setInterval(()=>{const d=new Date();if(s.skyDone&&!s.restored&&d.getHours()===0&&d.getMinutes()<5&&!s.meteor)spawn()},15000);if(s.skyDone&&!s.restored)say('<strong>セラ</strong>「……きれいに、できた？」');if(s.restored)say('<strong>セラ</strong>「君と一緒に星座を見たかったんだ。」');draw();})();
</script></body></html>
