function desk(){if(st.got.includes('desk'))return already();let step=st.seedStep||0;function view(){openModal('観測机',`<div class="paper"><b>星の種を育てる小さな実験</b><p>机に小さな瓶、星の種、透明なふたがある。窓の外には月明かり。</p></div><div style="font-size:65px;text-align:center;margin:18px 0">${['◇','✧','✦'][Math.min(step,2)]}</div><p>${['まず、種を瓶に入れてみよう。','瓶を月明かりの差す窓際に置こう。','瓶の中に、白い星が生まれた！'][Math.min(step,2)]}</p><div class="buttons"><button class="btn primary" id="seedAction">${['種を瓶に入れる','窓際に置く','星を取り出す'][Math.min(step,2)]}</button></div>`);$('seedAction').onclick=()=>{if(step>=2)collect('desk');else{step++;st.seedStep=step;clickTone();save();view()}}}view()}
function orb(){if(st.got.includes('orb'))return already();let n=st.polish||0;function view(){openModal('天球儀',`<div class="stage" style="display:grid;place-items:center"><button id="polish" style="width:150px;height:150px;border-radius:50%;border:7px solid #c5b58c;background:radial-gradient(circle,#7779b7,#2c326b);color:#fff;font-size:75px;filter:brightness(${.5+n*.075})" aria-label="球体をこする">${n>=7?'✦':'◌'}</button></div><p>表面がくすんだ天球儀。指で何度かこすってみよう。</p><div class="progress-bar"><span style="width:${Math.min(100,n*14)}%"></span></div>`);let btn=$('polish'),last=null;btn.onpointermove=e=>{if(e.buttons&&last!==null&&Math.abs(e.clientX-last)>5){last=e.clientX;n=Math.min(7,n+1);st.polish=n;save();if(n===7)collect('orb');else view()}};btn.onpointerdown=e=>{last=e.clientX};btn.onclick=()=>{n=Math.min(7,n+1);st.polish=n;placeTone();save();if(n>=7)collect('orb');else view()}}view()}
function shadow(){if(st.got.includes('shadow'))return already();let n=st.shadowStep||0;function view(){openModal('壁のランプ',`<div class="stage" style="display:grid;place-items:center"><div style="font-size:75px;filter:drop-shadow(${n===2?'0 0 12px #fff':'0 0 3px #777'})">${n===2?'✦':'◈'}</div></div><p>${['壁の飾りが、少し変わった影を落としている。','ランプの向きを変えると、星形の影ができた。','影の中心に、星の光が現れた！'][n]}</p><div class="buttons"><button class="btn primary" id="shadowAction">${['ランプを回す','影に触れる','星を拾う'][n]}</button></div>`);$('shadowAction').onclick=()=>{if(n===2)collect('shadow');else{n++;st.shadowStep=n;clickTone();save();view()}}}view()}
function startNpcMove(){if(st.npcMoving||st.npcAtScope)return;closeModal();st.npcMoving=true;st.zone=1;draw();say('わかった。ちょっと、覗いてみるね。');requestAnimationFrame(()=>{const npc=$('npc');npc.style.left='71%';npc.style.top='57%'});setTimeout(()=>{if(!st.npcMoving)return;st.npcMoving=false;st.npcAtScope=true;draw()},3200)}
function examineSera(){if(!st.eyeTaken){
 if(st.npcAtScope){say({name:'あなた',text:'セラは望遠鏡を覗き込んでいる。'});return}
 if(st.npcMoving)return;
 const invite=st.got.length===5&&st.mirrorSeen;
 openModal('セラ',`<div class="sera-clue"><img src="sera-dusk-face.webp" alt="セラ。両目の瞳に白い星が光っている"></div><p>「どうしたの？　何か見つけた？」</p><div class="buttons"><button class="btn" id="askConstellation">星座の話をする</button>${invite?'<button class="btn" id="inviteSera">望遠鏡を覗いてもらう</button>':''}<button class="btn" id="leaveSera">またあとで</button></div>`);
 $('askConstellation').onclick=()=>{closeModal();say('どんな星座になるんだろうね。窓のところから、拾った星を並べられるよ。')};
 $('leaveSera').onclick=closeModal;
 if(invite)$('inviteSera').onclick=startNpcMove;
 return
}
 if(st.restored){say('……星座、きれいだったね。ありがとう！');return}
 if(canResolveGate()){talkUnlitSera();return}
 examineUnlitSera();
}
function talkUnlitSera(){
 if(!seraSilent()||!canResolveGate())return;
 openModal('光を失ったセラ',`<div class="sera-clue"><img src="sera-dusk-unlit.webp" alt="光を失った瞳で話すセラ"></div>
  <p>「……うん。聞こえてるよ。」</p>
  <div class="buttons"><button class="btn" id="askGate">門のことを聞く</button><button class="btn" id="askFound">見つけてほしかったことを聞く</button><button class="btn" id="checkSera">セラのそばを調べる</button></div>`);
 const speak=text=>{closeModal();say({name:'セラ',unlit:true,text})};
 $('askGate').onclick=()=>speak('つなぐか、閉じるかは君に任せる。窓のいちばん左下の星を外せば、輪は閉じない。');
 $('askFound').onclick=()=>speak(st.observationLinked?'……なんだろう。遠くからなのに、君の声に聞こえた。':'私の紹介ページにも星を残したの。同じ形をつくって返事をくれたら、向こうからでも君だって分かると思う。');

}

 if(!seraSilent())return;
 openModal('光を失ったセラ',`<div class="sera-search">

 <div id="pocketFound" aria-live="polite"></div>`);
 $('lookPocket').onclick=()=>{
  if(st.keyFound){

function seraEye({label, lit=false, id='', focus='', interactive=false}){
 return `<div class="scope eye-view ${focus}" ${id?'id="'+id+'"':''}><img src="sera-a-unlit.webp" alt="${lit?'':label}">${lit?`<img class="eye-lit" src="sera-a-face.webp" alt="${label}">`:''}${interactive?'<button class="eye-hot" id="eyeHot" aria-label="白い光に触れる"></button>':''}</div>`;
}
function scope(){
 if(!st.npcAtScope||st.restored){
  st.mirrorSeen=true;save();
  openModal('望遠鏡',`<div class="scope"><img src="player-a-reflection.webp" alt="望遠鏡のレンズに映った自分の瞳"></div><p>……レンズを覗くと、自分の瞳が映り込んだ。</p>`);
  return;
 }
 if(st.meteorStar&&selectedItem==='meteor'){restoreScope();return}
 if(st.eyeTaken){
  openModal('望遠鏡',seraEye({label:'星を失った瞳'})+(st.meteorStar?'<p>流れ星から拾った白い星を選べば、ここで使えそうだ。</p>':'<p>セラの瞳から、白い光が消えている。</p>'));
  return;
 }
 const f=st.scopeFocus;
 if(f<2){
  openModal('望遠鏡',seraEye({label:'望遠鏡に映るぼんやりした像',lit:true,focus:f===0?'blurry':'lessblurry'})
   +`<p>${f===0?'像がぼやけて、何が見えているか分からない。':'……誰かの瞳のように見える。'}</p><div class="buttons"><button class="btn primary" id="focus">ピントを合わせる</button></div>`);
  $('focus').onclick=()=>{st.scopeFocus++;clickTone();save();scope()};
  return;
 }
 openModal('望遠鏡',seraEye({label:'望遠鏡に映るセラの瞳。白い星がある。',lit:true,id:'scopeArea',interactive:true})
  +'<p id="eyeHint">……セラの瞳の中で、白い星が静かに揺れている。</p>');
 const btn=$('eyeHot');
 let press=null;
 btn.onpointerdown=e=>{
  press={x:e.clientX,y:e.clientY};
  btn.setPointerCapture(e.pointerId);
 };
 btn.onpointercancel=()=>{press=null};
 btn.onpointerup=e=>{
  if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>22)takeEye();
  press=null;
 };
 btn.onclick=()=>{
  if(st.eyeNotice>=1){takeEye();return}
  st.eyeNotice=1;save();$('eyeHint').textContent='……いま、白い星が少し動いた？';
  $('scopeArea').classList.add('ripple');placeTone();
 };
}
function afterEyeAnimation(frame, className, finish){
 frame.classList.add(className);
 frame.addEventListener('animationend',()=>{if(frame.isConnected)finish()},{once:true});
}
function takeEye(){
 const btn=$('eyeHot');
 if(btn.disabled)return;
 btn.disabled=true;
 placeTone();
 afterEyeAnimation($('scopeArea').querySelector('.eye-lit'),'eye-taking',()=>{
  st.eyeTaken=true;msgQueue=[];onMsgsDone=null;nextMessage();save();draw();scope();
 });
}

}

}

 }

}

function television(){
 const channels=[['バラエティ','星の形のクッキーを作っています！'],['天気予報','夜空は晴れ。観測日和です。'],['天文ニュース','今夜、流星群が午前0時ごろに見頃を迎えます。'],['通販番組','天体観測用のクッションをご紹介！']];
 const canChange=st.remote&&selectedItem==='remote';
 const usedNow=canChange&&!st.remoteUsed;
 if(usedNow){st.remoteUsed=true;clickTone();save()}
 const c=channels[st.channel];
 if(st.channel===2){st.news=true;save()}
 openModal('テレビ',`<div class="television"><div class="broadcast">${st.channel===2?'<div class="tv-meteor">✦</div>':'✧　✦　✧'}</div><div class="crawl">YOIZORA TV ｜ ${c[0]}</div></div>
  <p><strong>${c[0]}</strong>：${c[1]}</p>${usedNow?'<p>ピッ。リモコンが反応した。</p>':''}
  ${canChange?'<div class="buttons"><button class="btn" id="prevTV" aria-label="前のチャンネル">◀</button><button class="btn" id="nextTV" aria-label="次のチャンネル">▶</button></div>':'<p>テレビ本体にはチャンネルを変えるボタンが見当たらない。</p>'}`);
 if(canChange){
  $('prevTV').onclick=()=>{st.channel=(st.channel+3)%4;clickTone();save();television()};
  $('nextTV').onclick=()=>{st.channel=(st.channel+1)%4;clickTone();save();television()};
 }
}
function inspect(id){if(id==='books')books();else if(id==='lamp')lamp();else if(id==='desk')desk();else if(id==='orb')orb();else if(id==='shadow')shadow();else if(id==='sera')examineSera();else if(id==='scope')scope();else if(id==='door')enterStaff();else if(id==='tv')television();else if(id==='window')sky()}
function constellationSvg(cls){let path=links.map(i=>targets[i].join(',')).join(' ');return `<svg class="${cls}" viewBox="0 0 100 100" aria-label="6個の星を結ぶ形"><polyline points="${path}" fill="none" stroke="#f3d59c" stroke-width="1.5"/>${targets.map(([x,y],i)=>`<circle data-star="${i}" cx="${x}" cy="${y}" r="3" fill="#fff5d5"/>`).join('')}</svg>`}
function sky(){
 if(seraSilent()&&st.news&&!st.meteorStar){
  const now=new Date();
  if(now.getHours()===0&&now.getMinutes()<5){st.meteor=true;save()}
 }
 const available=total()-st.placed.length;
 const full=st.placed.length===targets.length;
 const resolving=canResolveGate();
 const mayClose=resolving&&st.placed.length===targets.length-1&&!st.placed.includes(closureStar);
 const segments=links.slice(1).map((to,index)=>{
  const from=links[index];
  return st.placed.includes(from)&&st.placed.includes(to)?`${targets[from].join(',')} ${targets[to].join(',')}`:'';
 }).filter(Boolean);
 const note=full
  ?(st.observationLinked?'向こうから、あなたが送った返事が届いている。':'輪がつながった。向こうに続く気配がする。')
  :mayClose?'左下の星が保管箱にあり、輪が途切れている。':'左下を外して輪を切るか、六つを並べて観測するか。';
 openModal('窓の向こうの夜空',`<p>${resolving?'窓の星座を見つめる。':'集めた星を、夜空に並べよう。'+(st.got.includes('books')?'本棚で見た背表紙の形を思い出して。':'')}</p>
  <div class="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
   <polyline points="${links.map(i=>targets[i].join(',')).join(' ')}" fill="none" stroke="#fff1ca" opacity=".08" stroke-width=".6"/>
   ${segments.map(points=>`<polyline points="${points}" fill="none" stroke="#fff1ca" opacity=".9" stroke-width=".6"/>`).join('')}
  </svg>${targets.map(([x,y],i)=>`<button class="slot ${st.placed.includes(i)?'filled':''}" data-position="${i}" style="left:${x}%;top:${y}%" aria-label="${i===closureStar?'左下の星の位置':(i+1)+'番の星の位置'}">${st.placed.includes(i)?'✦':'·'}</button>`).join('')}</div>
  <p style="text-align:center">保管箱 ${available} 個 ／ 夜空 ${st.placed.length} / 6</p>
  ${resolving?`<div class="gate-resolution"><p>${note}</p><div class="buttons">
   ${full?'<button class="btn primary" id="observeGate">星座を観測する</button>':''}
   ${mayClose?'<button class="btn" id="closeGate">門を閉じる</button>':''}
  </div></div>`:'<p class="muted">場所をタップすると星を置ける。置いた星をタップすると戻せる。</p>'}
  ${st.meteor&&!st.meteorStar&&!resolving?'<div class="buttons"><button class="btn primary" id="meteorBtn">……流れ星が見える！</button></div>':''}`);
 for(const button of $('modalBody').querySelectorAll('[data-position]')){
  button.onclick=()=>{
   const position=Number(button.dataset.position);
   if(st.placed.includes(position))st.placed=st.placed.filter(i=>i!==position);
   else if(st.placed.length<total())st.placed.push(position);
   else{clickTone();return}
   placeTone();save();
   if(resolving||st.placed.length!==targets.length){sky();return}
   closeModal();triggerFlash();chime();
   if(st.restored)say(['……やっと完成したね！','君と一緒に星座を見たかったんだ。'],()=>showEnding());
   else say([{name:'あなた',text:'……星座ができた。'},{name:'あなた',text:'だけど、セラは望遠鏡を覗いたまま動かない。'}]);
   draw();
  };
 }
 if($('meteorBtn'))$('meteorBtn').onclick=meteorTake;
 if(full&&resolving)$('observeGate').onclick=()=>showEnding(st.observationLinked?'true':'open');
 if(mayClose)$('closeGate').onclick=()=>showEnding('closed');
}

  display.className='handset-display '+mode;
  $('handsetContent').innerHTML=content;
 }else{
  openModal('セラのスマートフォン',`<div class="handset"><div class="handset-display ${mode}" id="handsetDisplay">
   <div class="phone-statusbar"><span>00:00</span><span class="camera" aria-hidden="true"></span><span class="status-right">圏外 <span class="phone-battery" aria-label="バッテリー残量あり"></span></span></div>
   <div class="handset-content" id="handsetContent" tabindex="-1">${content}</div>
   <div class="phone-home-bar" aria-hidden="true"></div>
  </div></div>`);
  veil.classList.add('phone-mode');
 }
 internalModalCloser=()=>{
  if(!canHearSera())return false;
  phoneVoice();
  return true;
 };
 $('handsetContent').focus({preventScroll:true});
 fitModal();
}
const privatePosts=[
 {id:'reply',title:'同じ門から返事をする',text:'もう一つの場所に、あの並びで門を作った人がいれば、門を作った者同士でつながれる。私の自己紹介のページにも、六つの星を置いておく。もし見つけたら、天文台で作った星座と同じ形に結んで、そちらから返事をしてほしい。'},
 {id:'gate',title:'あの星座は、門になる',text:'六つの星をあの形に結べば、門が開く。ふたりで見るって約束した星座は、ここじゃない場所に声を届けるためのもの。誰かに、私を見つけてほしかった。'},
 {id:'watcher',title:'向こうからこちらも見える',text:'望遠鏡のふたを閉めてから撮った写真にも、星座の真ん中に目が写った。写真を閉じたあとも、画面の裏でまばたきが聞こえた。門を開けば、人じゃないものにもこちらが見えるかもしれない。'},
 {id:'close',title:'門を閉じる手順',text:'窓の夜空に並べた星のうち、左下の星をタップして、保管箱に戻す。残りの五つはそのままにして、窓で門を閉じる。その星を夜空に戻すと、門はまた開いてしまう。'}
];
function allPostsRead(){return privatePosts.every(({id})=>st.phoneRead.includes(id))}
function canHearSera(){return seraSilent()&&st.secondRun&&st.phoneUnlocked&&allPostsRead()&&!st.phoneConfessionSeen}
function leavePhone(){
 if(canHearSera())phoneVoice();else examineUnlitSera();
}
function phoneVoice(){
 if(!canHearSera())return;
 openPhoneModal('phone-voice','<p class="voice-line">「……見ちゃったんだね……」</p><button class="phone-back" id="putPhoneDown">スマホを伏せる</button>');
 $('putPhoneDown').onclick=seraConfession;
 internalModalCloser=()=>{seraConfession();return true};
 if(musicOn){tone(56,.88,.019);tone(83,.69,.011,.18)}
}
function seraConfession(){
 if(!canHearSera())return;
 internalModalCloser=null;
 closeModal();
 $('game').classList.add('confession-mode');
 const lines=[
  '……ずっと、誰かに見つけてもらいたかった。',
  'ここでいくら声を出しても、窓の外にさえ届いてない気がした。',
  'だから、あの星座を作ったんだ。ずっと遠くまで届くように。',
  '向こうに何がいるか、知らないふりはできなかった。それでも、誰にも気づかれない方が怖かった。',
  'ごめん。君に、何も言わずに星を集めてもらった。',
  '……怖かったら、窓の星をひとつ外して。門が閉じても、私は止めないよ。'
 ].map(text=>({name:'セラ',unlit:true,text}));
 say(lines,()=>{
  st.phoneConfessionSeen=true;save();
  $('game').classList.remove('confession-mode');
 });
}
function phoneHome(){
 if(!seraSilent()||!st.secondRun||!st.phoneUnlocked)return;
 openPhoneModal('phone-home',`<strong class="lock-time">00:00</strong><p class="lock-hint">ホーム</p>
  <div class="home-apps"><button class="home-app" id="openSocial"><span class="home-app-icon" aria-hidden="true">…</span>SNS</button></div>
  <button class="phone-back" id="phoneExit">セラのそばに戻る</button>`);
 $('openSocial').onclick=()=>phoneFeed();
 $('phoneExit').onclick=leavePhone;
}
function phoneFeed(privateAccount=false){
 if(!seraSilent()||!st.secondRun||!st.phoneUnlocked)return;
 const feed=privateAccount
  ?`<div class="phone-post-list">${privatePosts.map(({id,title},i)=>`<button class="phone-post-link" data-private-post="${i}"><time>観測記録 0${privatePosts.length-i}${st.phoneRead.includes(id)?'':'<span class="phone-unread">未読</span>'}</time><strong>${title}</strong></button>`).join('')}</div>`
  :'<article class="phone-post"><time>先ほど</time><p>今夜は晴れそう。天文台で待ってるね。</p></article>';
 openPhoneModal(privateAccount?'phone-private':'',`<div class="phone-toolbar"><button id="phoneHome">ホーム</button><strong>SNS</strong></div>
  <div class="phone-profile">
   ${privateAccount?'':'<img class="phone-avatar" src="sera-dusk-face.webp" alt="">'}
   <div><strong>${privateAccount?'観測記録':'宵空セラ'}</strong><span>${privateAccount?'非公開アカウント':'宵空天文台'}</span></div>
  </div>
  <div class="phone-tabs" aria-label="アカウント切替">
   <button id="publicAccount" aria-pressed="${!privateAccount}">通常アカウント</button>
   <button id="privateAccount" aria-pressed="${privateAccount}">裏アカウント</button>
  </div>${feed}`);
 $('phoneHome').onclick=phoneHome;
 $('publicAccount').onclick=()=>phoneFeed();
 $('privateAccount').onclick=()=>phoneFeed(true);
 for(const button of modal.querySelectorAll('[data-private-post]')){
  button.onclick=()=>phonePost(Number(button.dataset.privatePost));
 }
}
function phonePost(index){
 if(!seraSilent()||!st.secondRun||!st.phoneUnlocked)return;
 const {id,title,text}=privatePosts[index];
 if(!st.phoneRead.includes(id)){st.phoneRead.push(id);save()}
 openPhoneModal('phone-private',`<div class="phone-toolbar"><button id="backToPosts">戻る</button><strong>観測記録</strong></div>
  <article class="phone-post"><time>観測記録 0${privatePosts.length-index}</time><h3>${title}</h3><p>${text}</p></article>
  ${id==='watcher'?'<p class="phone-logged">画像は破損しています</p>':''}
  ${id==='reply'&&canResolveGate()?'<button class="phone-back" id="findObservation">宵空セラの紹介ページを開く</button>':''}`);
 if($('findObservation'))$('findObservation').onclick=openObservation;
 $('backToPosts').onclick=()=>{if(canHearSera())phoneVoice();else phoneFeed(true)};
}
function phone(){
 if(!seraSilent()||!st.secondRun)return;
 if(st.phoneUnlocked){phoneHome();return}
 openPhoneModal('phone-lock',`<strong class="lock-time">00:00</strong><p class="lock-hint">星座ロック</p>
  <div class="phone-board" id="phoneBoard">
   <svg viewBox="0 0 100 100" aria-hidden="true"><polyline id="phoneLine" fill="none" stroke="#dfcee7" stroke-width="1.2"/></svg>
   ${targets.map(([x,y],i)=>`<button type="button" class="phone-star" data-phone-star="${i}" style="left:${x}%;top:${y}%" aria-pressed="false" aria-label="${['左下','左上','中央下','右上','右下','いちばん上'][i]}の星">✦</button>`).join('')}
  </div>
  <p class="lock-hint" id="phoneStatus" aria-live="polite">光った順に6つの星をつなぐ</p>
  <div class="buttons"><button class="btn" id="clearPhone">やり直す</button><button class="btn" id="lockExit">戻る</button></div>`);
 $('lockExit').onclick=examineUnlitSera;
 const board=$('phoneBoard');
 const stars=[...board.querySelectorAll('[data-phone-star]')];
 let selected=[];
 let press=null;
 let dragging=false;
 function add(button){
  const index=Number(button.dataset.phoneStar);
  if(selected.includes(index)||selected.length===targets.length)return;
  selected.push(index);
  button.setAttribute('aria-pressed','true');
  $('phoneLine').setAttribute('points',selected.map(i=>targets[i].join(',')).join(' '));
  placeTone();
  if(selected.length!==targets.length)return;
  if(!selected.every((star,i)=>star===phoneOrder[i])){
   $('phoneStatus').textContent='順番が違うようだ。';
   return;
  }
  st.phoneUnlocked=true;save();if(musicOn)tone(96,.42,.035);phoneHome();
 }
 stars.forEach(btn=>{btn.onclick=()=>add(btn)});
 board.onpointerdown=e=>{
  const button=e.target.closest('[data-phone-star]');
  if(e.isPrimary&&button)press={id:e.pointerId,button,x:e.clientX,y:e.clientY};
 };
 board.onpointermove=e=>{
  if(!press||press.id!==e.pointerId)return;
  if(!dragging){
   if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<8)return;
   dragging=true;
   board.setPointerCapture(e.pointerId);
   add(press.button);
  }
  const button=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-phone-star]');
  if(!button||!board.contains(button))return;
  const {left,top,width,height}=button.getBoundingClientRect();
  if(Math.hypot(e.clientX-left-width/2,e.clientY-top-height/2)<=17)add(button);
 };
 const release=()=>{press=null;dragging=false};
 board.onpointerup=release;
 board.onpointercancel=release;
 board.onpointerleave=()=>{if(!dragging)release()};
 $('clearPhone').onclick=()=>{
  selected=[];release();$('phoneLine').removeAttribute('points');
  stars.forEach(btn=>btn.setAttribute('aria-pressed','false'));
  $('phoneStatus').textContent='光った順に6つの星をつなぐ';
 };
}
function openObservation(){
 if(!canResolveGate())return;
 const pending=st.observationPending||Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16).padStart(8,'0')).join('');
 st.observationPending=pending;
 save();
 const page=new URL('observation.html',location.href);
 page.hash=new URLSearchParams({attempt:pending}).toString();
 location.assign(page);
}
function acceptObservation(){
 const fragment=new URLSearchParams(location.hash.slice(1));
 if(!fragment.has('observation'))return false;
 const token=fragment.get('observation');
 history.replaceState(null,'',location.pathname+location.search);
 if(!canResolveGate()||!token||token!==st.observationPending)return false;
 st.observationLinked=true;st.observationPending=null;st.zone=1;save();
 return true;
}
let titleTimer;
function stopTitleStars(){clearInterval(titleTimer)}
function title(){
 stopTitleStars();
 $('titleScreen').hidden=false;
 $('titleStars').innerHTML=st.endingDone?constellationSvg('title-constellation'):'';
 $('titleSubtitle').textContent=st.endingDone?'ふたりで見た星座は、今夜も空に輝いている。':'君と紡ぐ、ひとつの星座。';
 $('startBtn').textContent=canStartSecondRun()?'2周目をはじめる':st.introSeen?'つづきから':'ゲームをはじめる';
 if(!st.endingDone)return;
 const stars=[...$('titleStars').querySelectorAll('[data-star]')];
 let beat=0;
 titleTimer=setInterval(()=>{
  stars.forEach((star,index)=>star.classList.toggle('lit',index===phoneOrder[beat]));
  beat=(beat+1)%(phoneOrder.length+2);
 },800);
}
function canStartSecondRun(){return st.endingDone&&!st.secondRun&&st.restored&&st.placed.length===6}
function restart(){
 st={...defaults(),endingDone:st.endingDone,secondRun:st.endingDone};selectedItem=null;
 msgQueue=[];onMsgsDone=null;nextMessage();save();play();
}
function play(){stopTitleStars();$('titleScreen').hidden=true;if(!musicOn)musicSwitch(true);draw();if(!st.introSeen){st.introSeen=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日はね、君と一緒に星座を見たいんだ。','ここには、いろんな仕掛けがあるの。遊んだり調べたりすると、小さな星が見つかるよ！','出てきた星は、タップして拾ってね。星は保管箱に入るよ。','集めた星は、窓から見える夜空に置けるんだ。どんな星座になるかな？','……私、ずっと誰かと一緒に星座を見たかったんだ。今日は楽しみ！'])}};
$('startBtn').onclick=()=>{if(canStartSecondRun())restart();else play()};
$('titleReset').onclick=()=>{if(confirm('この周の進行をリセットして最初から遊ぶ？'))restart()};
$('homeBtn').onclick=()=>{closeModal();title()};
$('resetBtn').onclick=$('titleReset').onclick;
$('devBtn').onclick=()=>{if(!st.eyeTaken){say({name:'システム',text:'流れ星のテストはセラの瞳から星を取った後に使える。'});return}st.news=true;st.meteor=true;save();say({name:'システム',text:'流れ星が現れた。窓の空を見よう。'})};
let endPhase=0;
const endingLines={
 first:['……セラの瞳が、ふたたび光りだす。','セラは望遠鏡から顔を上げ、あなたを見つめた。','……わあ。きれい。','君と一緒に星座を見たかったんだ。','✧ ふたりの星座 ✧'],
 open:['六つの星がつながった。窓の外で、何かがまばたきをした。','「……見つけてくれたの？」','誰も答えていない。けれどセラは、窓の前でそっと耳を澄ませた。','接続エンド ― 向こうからの視線'],
 closed:['左下の星を戻すと、窓の奥に残っていた光が消えた。','「……閉じたんだね。」','セラは暗い窓を見つめた。「少しだけ、ここにいてくれる？」','閉門エンド ― 届かなかった星座'],
 true:['六つの星がつながる。同じ形を結んだあなたの返事が、窓の向こうから届いた。','窓の奥の視線が消え、セラの瞳に、白い星がふたたび灯る。','「……君が、見つけてくれたんだね。」','真エンド ― 君が見つけた星座']
};
function showEnding(route='first'){
 $('endingScreen').dataset.route=route;
 $('endNext').disabled=false;
 $('endTitle').textContent='タイトルへ';
 st.endingDone=true;
 if(route==='true')st.restored=true;
 save();closeModal();musicSwitch(false);endPhase=0;
 $('endingScreen').hidden=false;
 const figure=constellationSvg('').replace(/^<svg[^>]*>|<\/svg>$/g,'');
 const closedFigure=links.slice(1,-1).map(i=>targets[i].join(',')).join(' ');
 $('endConst').innerHTML=(route==='closed'
  ?`<polyline points="${closedFigure}" fill="none" stroke="#e4d9c2" stroke-width="1" opacity=".55"/>`
  :figure)+(['first','open'].includes(route)?'<image id="endOmen" href="end-omen.png" x="35" y="42" width="24" height="15"/>':'');
 $('endMusic').hidden=true;
 $('endText').textContent=endingLines[route][endPhase];
 $('songInfo').textContent='';
}
$('endNext').onclick=()=>{
 const route=$('endingScreen').dataset.route;
 const lines=endingLines[route];
 endPhase=Math.min(lines.length-1,endPhase+1);
 $('endText').textContent=lines[endPhase];
 if(route==='first'||route==='true')chime();
 if(route==='first'&&endPhase>=3){
  $('endMusic').hidden=false;
  $('songInfo').textContent='歌声と星空を一緒に楽しめるよ。';
 }
 if(endPhase===lines.length-1){
  $('endOmen')?.classList.add('reveal-omen');
  $('endNext').disabled=true;$('endTitle').textContent='星座のあるタイトルへ';
 }
};
$('endTitle').onclick=()=>{$('song').pause();$('endingScreen').hidden=true;title()};$('endMusic').onclick=async()=>{let audio=$('song');try{await audio.play();$('songInfo').textContent='♪ 星座になれたら';$('endMusic').textContent='♪ 再生中'}catch(e){$('songInfo').textContent='歌唱音源は未収録です。ending_song.mp3 を同じフォルダに置くと、ここで流れます。';tone(784,.5,.04);tone(1047,.6,.03,.12)}};$('song').onended=()=>{$('endMusic').textContent='♪ もう一度聴く'};
setInterval(()=>{if(st.eyeTaken&&st.news&&!st.restored&&!st.meteorStar){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5)st.meteor=true}},20000);
if(st.npcMoving){st.npcAtScope=true;st.npcMoving=false}
if(acceptObservation()){play();say({name:'あなた',text:'窓の向こうで、小さな光がひとつ返事をした。'});}
else{draw();title();}
})();
</script></body></html>
