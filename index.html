:root{--night:#131832;--pane:#222650;--ink:#f6f3ff;--muted:#d5d1ec;--gold:#f8dba2;--lilac:#b7b2df}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(circle at 50% 0,#474477,#12162f 67%);color:var(--ink);font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid white;outline-offset:2px}button:disabled{opacity:.45;cursor:default}button:not(:disabled):active{transform:translateY(1px)}[hidden]{display:none!important}#game{max-width:920px;margin:auto;padding:10px 12px 38px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.topbar h1{font-size:clamp(16px,3.6vw,23px);margin:0;color:#f5e4ba;letter-spacing:.10em}.topbar .buttons{display:flex;gap:6px}.tinybtn{background:#20254b;border:1px solid #a9a0d1;padding:9px 11px;font-size:12px;min-height:40px}.panelborder{border:2px solid #dbc69a;box-shadow:0 0 0 4px #29284f,0 14px 35px #0b0d23;background:#171c3d}.world{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;border:3px solid #6d668e;background:#171d3b;isolation:isolate}.world>#mapArt{position:absolute;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;inset:0}.world>.character{position:absolute;width:8.8%;height:19%;object-fit:contain;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(1px 5px 2px #0b0d23c9);transition:left 2.5s linear,top 2.5s linear}.character.frozen{filter:saturate(.35) brightness(.84) drop-shadow(1px 5px 2px #0b0d23c9)}#player{left:50%;top:73%;width:8%;height:17%}#sera{left:49%;top:55%}.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:clamp(31px,5.4vw,45px);height:clamp(31px,5.4vw,45px);background:none;border:0;touch-action:manipulation;z-index:2}.pin i{display:block;width:13px;height:13px;background:#fff9e5;border:2px solid #f1d58b;transform:rotate(45deg);b round:#e9dbc4;color:#292748;padding:14px;border:4px double #baac8f}.sky{height:min(60vw,360px);min-height:260px;position:relative;overflow:hidden;border:2px solid #969ac8;background:radial-gradient(ellipse at 58% 43%,#41498b,#161c43 72%);touch-action:manipulation}.sky:before{content:'·　　 ✧　　 ·　　　　 ✦　　·　　✧';position:absolute;top:12%;left:10%;opacity:.35;color:white}.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.slot{position:absolute;transform:translate(-50%,-50%);border:1px dashed #8d8cb4;color:#a1a6cb;width:46px;height:46px;border-radius:50%;background:#20254b55;font-size:24px;display:grid;place-items:center;touch-action:manipulation}.slot.filled{color:#fff0bc;text-shadow:0 0 12px white;border:0;background:none;font-size:36px}.tray{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;border:1px solid #6d6da2;padding:8px;margin-top:10px;min-height:56px}.tray button{font-size:25px;color:#fff0bf;background:#35355f;border:1px solid #a59cc4;min-width:43px;height:43px;touch-action:none}.scope{position:relative;aspect-ratio:1;width:min(90%,340px);margin:12px auto;border-radius:50%;border:13px solid #8d84b2;outline:5px solid #34315f;overflow:hidden;background:#20244e}.scope img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.scope .white-star{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:none;border:0;color:white;font-size:60px;text-shadow:0 0 10px white,0 0 20px #fff;touch-action:none;user-select:none}.scope.blur1 img{filter:blur(13px)}.scope.blur2 img{filter:blur(6px)}.scope.blur3 img{filter:blur(2px)}.scope.lost img{filter:grayscale(.6) brightness(.7)}.scope .fly{position:absolute;top:45%;left:45%;color:white;font-size:60px;pointer-events:none;animation:flyAway .9s forwards}@keyframes flyAway{to{transform:translate(160px,-150px) scale(.2);opacity:0}}.scope .returning{position:absolute;top:0%;left:95%;color:white;font-size:60px;pointer-events:none;animation:flyBack 1s forwards}@keyframes flyBack{to{top:44%;left:42%;transform:scale(.1);opacity:0}}.staffmap{position:relative}.staffmap>img{width:100%;display:block;image-rendering:pixelated}.staffmap button{position:absolute;transform:translate(-50%,-50%);border:0;background:none;color:#fff1bf;font-size:32px;text-shadow:0 0 10px white}.screen{position:relative;overflow:hidden;border:11px solid #54527f;background:#111b42;height:208px;margin-bottom:10px}.screen .ticker{position:absolute;bottom:0;left:0;right:0;padding:7px 8px;background:#e9e7f1;color:#1d2547;font-size:12px}.screen .meteor-anim{position:absolute;top:20%;left:80%;font-size:50px;color:#fff5aa;animation:meteor 2.2s infinite ease-in}.screen .moon{position:absolute;top:12px;right:20px;font-size:80px;color:#efe9c4}.screen .cloud{position:absolute;left:15%;bottom:30%;font-size:58px;color:#cccfea;animation:float 3s infinite alternate}@keyframes meteor{to{transform:translate(-430px,150px);opacity:0}}@keyframes float{to{transform:translateX(30px)}}.title,.end{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0e1230;overflow:auto}.title-bg{position:absolute;inset:0;background:linear-gradient(#0b10365e,#0a1036a8),url('title_art.png') center/cover;filter:saturate(1.1)}.title-main{z-index:1;text-align:center;padding:25px 15px;text-shadow:0 3px 8px #070c27}.title-main h1{font-size:clamp(33px,9vw,68px);font-weight:500;letter-spacing:.16em;color:#fff0c8;margin:12px 0}.title-main p{font-size:14px;color:#eee3ff}.title-main button{margin-top:14px;min-width:220px}.title-mark{font-size:13px;letter-spacing:.25em;color:#f0d9b0}.title-svg{height:125px;width:175px;margin:auto;opacity:0;transition:opacity .5s;filter:drop-shadow(0 0 9px white)}.title.cleared .title-svg{opacity:1}.end{background:radial-gradient(ellipse at 50% 35%,#555ba3,#0d1436 75%)}.end-scene{position:relative;width:min(92vw,800px);aspect-ratio:1.67;background:url('title_art.png') center/cover;border:2px solid #d5bd91;overflow:hidden}.end-scene img{position:absolute;widt <div id="title" class="title"><div class="title-bg"></div><div class="title-main"><div class="title-mark">✧ A LITTLE OBSERVATORY STORY ✧</div><svg class="title-svg" viewBox="0 0 175 125"><polyline points="28,95 54,42 96,20 151,59 128,100 72,109 28,95" fill="none" stroke="#fff0b5" stroke-width="2.4"/><g fill="#fff6df"><circle cx="28" cy="95" r="4"/><circle cx="54" cy="42" r="4"/><circle cx="96" cy="20" r="4"/><circle cx="151" cy="59" r="4"/><circle cx="128" cy="100" r="4"/><circle cx="72" cy="109" r="4"/></g></svg><h1>宵空天文台</h1><p id="titleSub">君と紡ぐ、ひとつの星座</p><button class="btn primary" id="start">ゲームをはじめる</button><br><button class="btn" id="newGame">はじめから</button><p class="muted">スマホでも、気になる場所をタップするだけで遊べます。</p></div></div>
<main id="game"><div class="topbar"><h1>✧ 宵空天文台</h1><div class="buttons"><button class="tinybtn" id="home">タイトル</button><button class="tinybtn" id="sound">♪ OFF</button></div></div><div class="panelborder"><div class="world" id="world"><img id="mapArt" src="map_clean.png" alt="天文台の部屋。星のマークがある場所をタップして探索"><span class="world-label" id="roomLabel">天文台・観測室</span><img id="player" class="character" src="player_sprite.png" alt="あなた"><img id="sera" class="character" src="sera_sprite.png" alt="案内人セラ"><div id="pins"></div></div><div class="progress"><div class="progressbar"><strong>ほしの保管箱 <span id="count">0/6</span></strong><div class="star-count" id="starCount" aria-label="集めた星"></div></div><div class="actions"><button class="btn" id="openSky">星空を見る</button><button class="btn" id="bag">もちもの</button></div></div><div class="status" id="status">光る印をタップして探索しよう。</div></div><div class="msg" id="msg"><img id="msgArt" src="sera_portrait.png" alt="セラ"><div class="words"><b id="msgName">セラ</b><div id="msgText"></div></div><button class="next" id="msgNext" aria-label="次へ">▾</button></div><p class="muted" style="margin-top:18px;text-align:center"><button class="tinybtn" id="dev">DEV：流れ星</button>　※開発用・セーブはこの端末に保存</p></main>
<div id="overlay" class="overlay" hidden><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="ゲームのイベント"></div></div>
<div id="end" class="end" hidden><div style="width:min(96%,820px)"><div class="end-scene"><svg class="end-constellation" viewBox="0 0 175 125"><polyline points="28,95 54,42 96,20 151,59 128,100 72,109 28,95" fill="none" stroke="#ffe8a6" stroke-width="2"/><g fill="white"><circle cx="28" cy="95" r="4"/><circle cx="54" cy="42" r="4"/><circle cx="96" cy="20" r="4"/><circle cx="151" cy="59" r="4"/><circle cx="128" cy="100" r="4"/><circle cx="72" cy="109" r="4"/></g></svg><img src="sera_sprite.png" alt="セラ"><img src="player_sprite.png" alt="あなた"></div><div class="end-caption"><h2 id="endText">君と一緒に星座を見たかったんだ。</h2><p id="songStatus">セラと並んで、同じ夜空を見上げた。</p><button class="btn primary" id="endPlay">♪ 歌とエンディングを再生</button><button class="btn" id="endHome">タイトルに戻る</button><audio id="song" src="ending_song.mp3" preload="none"></audio></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const KEY='sera-observatory-v7';const points=[[22,72],[39,40],[62,22],[82,47],[70,76],[43,82]];
const defaults=()=>({seenIntro:false,done:{},stars:0,placed:[],npc:'center',eye:false,scopeFocus:0,keys:false,room:'main',remote:false,news:false,channel:0,meteor:false,meteorStar:false,restored:false,cleared:false,bookOrder:[3,0,5,2,1,4]});
let st=defaults();try{st=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let audio=null,musicTimer=null,musicEnabled=false,musicStep=0;function context(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}catch(e){return null}}
function note(f,dt=.25,gain=.035,delay=0){const a=context();if(!a)return;let t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dt);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dt+.02)}
const chime=()=>[783.99,1046.5,1318.5,1760].forEach((f,i)=>note(f,.75,.07,i*.10));const placeSound=()=>[587.3,783.99].forEach((f,i)=>note(f,.25,.047,i*.09));const clickSound=()=>note(660,.11,.025);
function music(on){if(!on){musicEnabled=false;clearInterval(musicTimer);musicTimer=null;$('sound').textContent='♪ OFF';return;}if(musicEnabled)return;context();musicEnabled=true;$('sound').textContent='♪ ON';musicTimer=setInterval(()=>{const melodic=st.eye&&!st.restored?[392,0,349,0,329.6,0,293.7,0]:[523,659,784,659,587,659,523,392];let f=melodic[musicStep++%melodic.length];if(f)note(f,.42,.012)},480)}
$('sound').onclick=()=>music(!musicEnabled);
let msgList=[],msgAfter=null;function say(lines,after){msgList=(Array.isArray(lines)?lines:[lines]).slice();msgAfter=after||null;advance();}
function advance(){const item=msgList.shift();if(item===undefined){$('msg').classList.remove('visible');let cb=msgAfter;msgAfter=null;if(cb)cb();return}const was=typeof item==='string'?{name:'セラ',text:item}:item;$('msg').classList.add('visible');$('msgName').textContent=was.name||'セラ';$('msgText').textContent=was.text;$('msgArt').src=(st.eye&&!st.restored?'sera_sleep.png':'sera_portrait.png')};$('msgNext').onclick=advance;
function hideMsg(){$('msg').classList.remove('visible');msgList=[];msgAfter=null}
function modal(title,html){$('modal').innerHTML=`<button class="modal-close" data-close aria-label="閉じる">×</button><h2>${title}</h2>${html}`;$('overlay').hidden=false;$('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function close(){$('overlay').hidden=true;render();} $('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});
const hotspots=[{id:'books',label:'本棚',x:18,y:31},{id:'clock',label:'時計',x:33,y:24},{id:'window',label:'大きな窓',x:49,y:19},{id:'scope',label:'望遠鏡',x:51,y:39},{id:'orb',label:'天球儀',x:67,y:39},{id:'notes',label:'観測ノート',x:51,y:58},{id:'staff',label:'スタッフ室の扉',x:88,y:38},{id:'tv',label:'テレビ',x:18,y:79},{id:'shadow',label:'ランプ',x:75,y:74},{id:'seed',label:'星の小瓶',x:83,y:79},{id:'sera',label:'セラ',x:58,y:53}];
function render(){const npc=$('sera');if(st.room==='staff'){$('mapArt').src='staff_clean.png';$('roomLabel').textContent='スタッフ室';npc.hidden=true;$('player').hidden=true}else{$('mapArt').src='map_clean.png';$('roomLabel').textContent='天文台・観測室';npc.hidden=false;$('player').hidden=false;npc.style.left=(st.npc==='scope'?54:49)+'%';npc.style.top=(st.npc==='scope'?43:55)+'%';npc.classList.toggle('frozen',st.eye&&!st.restored);npc.classList.toggle('float-ghost',false)}
const actual=st.room==='staff'?[{id:'shelf',label:'スタッフ用本棚',x:24,y:47},{id:'desk',label:'机',x:51,y:48},{id:'cabinet',label:'戸棚',x:84,y:49},{id:'exit',label:'天文台に戻る',x:10,y:65}]:hotspots.filter(p=>p.id!=='sera'||(st.npc==='scope'&&st.eye));
$('pins').innerHTML=actual.map(p=>`<button class="pin ${st.done[p.id]?'off':''}" aria-label="${p.label}を調べる" title="${p.label}" style="left:${p.x}%;top:${p.y}%" data-id="${p.id}"><i></i></button>`).join('');$('pins').querySelectorAll('button').forEach(b=>b.onclick=()=>inspect(b.dataset.id));
const held=st.stars+(st.eye?1:0);$('count').textContent=`${held}/6`;$('starCount').innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<held?'on':''}">✦</span>`).join('');$('status').textContent=st.restored?'セラと一緒に星座を見ることができた。':st.eye?st.cleared?'星座は完成した。でも、セラはまだ動かない。':'セラは望遠鏡を覗いたまま、動かない。':st.stars===5?'5個の星が集まった。セラが望遠鏡の方にいる。':'気になる場所の光る印をタップして探索しよう。';save();}
function fifth(){st.npc='scope';render();const sera=$('sera');sera.classList.add('walking');setTimeout(()=>sera.classList.remove('walking'),2600);say(['わあ、5つ集まった！ すごい、あと少しだね。','ちょっと望遠鏡を覗いてみるね。……何か見えるかな？']);}
function reward(id){if(st.done[id]){close();return}modal('ひとつ、見つけた。',`<div class="pick-star" id="pickArea"><button id="takePickup" aria-label="星を拾う">✦</button></div><p class="muted">光をタップして拾おう。</p>`);$('takePickup').onclick=()=>{const area=$('pickArea');area.classList.add('gone');chime();$('takePickup').disabled=true;setTimeout(()=>{st.done[id]=true;st.stars++;close();say(st.stars===5?['星が5個そろった！','……']:['シャララン……！','星がひとつ、保管箱におさまった。'],st.stars===5?fifth:null)},650)} }
function simplePickup(id,title,description){if(st.done[id]){modal(title,'<p>もうここには星はない。かわりに淡い光の余韻が残っている。</p>');return}modal(title,`<p>${description}</p><button class="btn primary" id="startPlay">調べる</button>`);$('startPlay').onclick=()=>reward(id)}
const bookPages=['夜が明け、観測を終えた。','夜のとばりが下り、最初の星が現れた。','太陽が高く昇り、道具を点検した。','真夜中、空いっぱいに星が輝いた。','朝の光が差し込み、観測が始まった。','夕日が沈み、空が茜色に染まった。'];const correct=[4,2,5,1,3,0];let pickBook=null;
function bookshelf(){if(st.done.books){modal('本棚',`<div class="paper"><p>本は正しい順番に並んでいる。</p><p style="text-align:center;font-size:24px">✦　✦<br>　✦　✦<br>✦　　　✦</p><p>背表紙の白い模様が、ひとつの図形を描いている。</p></div><p class="muted">この形、どこかで使えるかもしれない。</p>`);return}
const show=()=>{const bs=st.bookOrder;modal('本棚 — 六冊の観測日誌',`<p>本の中身を読んで、物語の時間順に並べよう。<br><span class="muted">本を2冊タップすると位置が入れ替わる。</span></p><div class="books">${bs.map((idx,i)=>`<button class="book ${pickBook===i?'sel':''}" data-b="${i}"><b>${i+1}冊目</b><br>${bookPages[idx]}</button>`).join('')}</div><div class="control"><button class="btn primary" id="checkBooks">並びを確かめる</button></div><p class="muted" id="bookFeedback"></p>`);document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{let i=+b.dataset.b;if(pickBook===null){pickBook=i;show()}else{[bs[pickBook],bs[i]]=[bs[i],bs[pickBook]];pickBook=null;save();clickSound();show()}});$('checkBooks').onclick=()=>{if(bs.every((v,i)=>v===correct[i])){pickBook=null;reward('books')}else $('bookFeedback').textContent='まだ物語の順番が違うみたい。'}};show()}
let chaseCount=0,lampDark=false;function chase(){if(st.done.clock)return simplePickup('clock','ランプの下','星がいた気配だけが残っている。');function drawChase(){modal('逃げる星',`<p>時計のそばを、ちいさな星が飛んでいる。</p><div class="playfield ${lampDark?'lamp-off':''}" id="chaseField"><button class="escape-star" id="escape" style="left:${[16,65,35,73,20][chaseCount%5]}%;top:${[24,40,62,16,55][chaseCount%5]}%">✦</button></div><button class="btn lampbutton" id="lamp">${lampDark?'ランプをつける':'ランプを消す'}</button><p class="muted" id="chaseText">${chaseCount>=2?'近づくと逃げちゃう。光が苦手なのかな……。':'タップしてみよう。'}</p>`);$('escape').onclick=()=>{if(lampDark){reward('clock');return}chaseCount++;clickSound();drawChase()};$('lamp').onclick=()=>{lampDark=!lampDark;drawChase()}}drawChase()}
let rub=0;function polish(){if(st.done.orb)return simplePickup('orb','天球儀','きれいに磨かれて、ぴかぴかに光っている。');modal('くすんだ星',`<p>天球儀の中に、光らない石がある。指でなぞって磨いてみよう。</p><div class="playfield" id="rubField" style="display:grid;place-items:center;touch-action:none"><div id="rubStone" style="font-size:92px;color:#aaa8bd;filter:brightness(.6)">✦</div></div><div class="meter"><div id="rubBar"></div></div><button class="btn" id="rubTap">少し磨く</button>`);const upd=()=>{rub=Math.min(100,rub+9);$('rubBar').style.width=rub+'%';$('rubStone').style.filter=`brightness(${.6+rub/75}) drop-shadow(0 0 ${rub/12}px white)`;if(rub>=100)reward('orb')};let last=0;$('rubField').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){if(Date.now()-last>65){last=Date.now();upd()}}});$('rubField').addEventListener('pointerdown',upd);$('rubTap').onclick=upd}
let lampShift=0;function shadows(){if(st.done.shadow)return simplePickup('shadow','星の影','壁にはもう星の影は映っていない。');function show(){modal('星の影',`<p>ランプを動かすと、壁の影が変化する。</p><div class="playfield" style="height:210px"><div class="mirror" style="left:${12+lampShift*14}%;bottom:8%">☼</div><div class="shadow-star" style="opacity:${.25+lampShift*.18};filter:blur(${Math.max(0,4-lampShift)}px)">✦</div></div><div class="control"><button class="btn" id="shift">ランプを動かす</button><button class="btn" id="shadowTouch" ${lampShift<4?'disabled':''}>影に触れる</button></div>`);$('shift').onclick=()=>{lampShift=Math.min(4,lampShift+1);clickSound();show()};$('shadowTouch').onclick=()=>reward('shadow')};show()}
let seedStage=0;function seed(){if(st.done.seed)return simplePickup('seed','小瓶','空っぽの瓶が窓辺に置かれている。');function show(){modal('星を育てる',`<p>${['小さな瓶がある。中には何も入っていない。','机の引き出しから「星の種」を見つけた。','瓶の中に種が入った。月明かりを当てられそう。','瓶の中で、光が育ちはじめた。'][Math.min(seedStage,3)]}</p><div class="playfield" style="display:grid;place-items:center;font-size:75px;color:#f7dfac">${['◇','✧','◈','✦'][Math.min(seedStage,3)]}</div><div class="control"><button class="btn primary" id="seedAction">${['引き出しを調べる','種を瓶に入れる','窓辺に置く','光に触れる'][Math.min(seedStage,3)]}</button></div>`);$('seedAction').onclick=()=>{seedStage++;if(seedStage===4)reward('seed');else{placeSound();show()}}}show()}
function notes(){modal('観測ノート',`<div class="paper"><b>古い観測メモ</b><p>星座の図形は、夜空に描いたときにだけ完成する。</p><p>同じ星を、別の場所で見つけられることもある。</p></div><p class="muted">机のノートには、集め方のヒントが書かれている。</p>`)}
function staffDoor(){if(!st.eye){say('そっちはスタッフ専用だよ〜。ごめんね！');return}if(!st.keys){modal('スタッフ室の扉','<p>扉には鍵がかかっている。</p><p>セラは望遠鏡を覗いたまま、返事をしない。</p>');return}st.room='staff';save();render();say([{name:'あなた',text:'カチャリ。鍵が回り、初めてスタッフ室の扉が開いた。'}])}
function examineSera(){if(!st.eye){say('もう少しで星がそろうね！');return}if(st.restored){say('ねえ、もう一度あの星座を見よう！');return}if(st.keys){say({name:'あなた',text:'セラは望遠鏡から目を離さない。呼びかけても、返事がない。'});return}
modal('セラを調べる',`<img src="sera_sleep.png" alt="光を失ったセラ" style="float:left;width:105px;margin:0 12px 6px 0;image-rendering:pixelated"><p>セラは望遠鏡を覗いたまま、ぴくりとも動かない。</p><p>声をかけても、返事がない。</p><div class="control"><button class="btn" id="lookPocket">服のポケットを調べる</button><button class="btn" id="lookHat">帽子を調べる</button></div><p id="seraFind" class="muted"></p>`);$('lookHat').onclick=()=>$('seraFind').textContent='羽の飾りがついている。……いつもと変わらない。';$('lookPocket').onclick=()=>{st.keys=true;save();chime();$('seraFind').textContent='小さな真鍮の鍵が入っていた。「スタッフ室」と刻まれている。';$('lookPocket').disabled=true;say([{name:'あなた',text:'セラのポケットから、スタッフ室の鍵を見つけた。'}])}}
function staffInspect(id){if(id==='exit'){st.room='main';render();return}let txt={shelf:'観測資料が並んでいる。「光は失われるのではなく、また巡る」。そんな一文が目に留まった。',desk:'セラのメモ。「今日、誰かと一緒に星座を見られるかな。ずっと楽しみにしてたんだ」。',cabinet:'戸棚の引き出しを開けると、テレビのリモコンがあった。'}[id];if(id==='cabinet'){st.remote=true;chime();save()}modal(id==='cabinet'?'戸棚':id==='desk'?'セラの机':'スタッフ用本棚',`<p>${txt}</p>${id==='cabinet'?'<p class="notice">リモコンを手に入れた。</p>':''}`)}
function tv(){const c=[['バラエティ','今日は星形クッキーを作ります！'],['天気予報','今夜は雲が晴れて、観測日和になるでしょう。'],['天文ニュース','本日午前0時ごろ、流星群の活動がピークを迎える見込みです。'],['通販','天体観測のお供に、ふかふかクッション！']][st.remote?st.channel:0];if(st.remote&&st.channel===2){st.news=true;save()}
modal('テレビ',`<div class="screen"><div class="moon">${st.channel===2?'✧':'◕'}</div><div class="cloud">${st.channel===1?'☁':'✧'}</div>${st.channel===2?'<div class="meteor-anim">✦</div>':''}<div class="ticker">YOIZORA TV　｜　${c[0]}</div></div><p><strong>${c[0]}</strong>　${c[1]}</p>${st.remote?'<div class="control"><button class="btn" id="prev">◀ 前の番組</button><button class="btn" id="next">次の番組 ▶</button></div>':'<p class="muted">リモコンがなく、チャンネルを変えられない。</p>'}`);if(st.remote){$('prev').onclick=()=>{st.channel=(st.channel+3)%4;clickSound();tv()};$('next').onclick=()=>{st.channel=(st.channel+1)%4;clickSound();tv()}}}
function scope(){if(st.npc!=='scope'){say('望遠鏡はまだ調整中みたい。セラが使い方を知っていそう。');return}if(st.meteorStar&&!st.restored){modal('望遠鏡',`<div class="scope lost" id="scopeImage"><img src="eye_empty.png" alt="星のない瞳"><span class="returning">✦</span></div><p>白い星を瞳に戻そう。</p><div class="control"><button class="btn primary" id="restore">星を戻す</button></div>`);$('restore').onclick=restore;return}
if(st.restored){say('星座、きれいだね。');return}
if(st.eye){modal('望遠鏡',`<div class="scope lost"><img src="eye_empty.png" alt="光のない瞳"></div><p>……瞳は何も映していない。</p>`);return}
const f=st.scopeFocus;modal('望遠鏡',`<div class="scope blur${Math.min(f+1,3)}" id="scopeImage"><img src="eye_lit.png" alt="望遠鏡越しに見えるセラの瞳">${f>=3?'<button class="white-star" id="eyeStar" aria-label="瞳の白い星に触れる">✦</button>':''}</div><p>${f===0?'暗く、何も見えない。':f===1?'何かがぼんやり見える。':f===2?'……セラの瞳？ 中で何かが光っている。':'白い光が、瞳の中にある。'}</p>${f<3?'<div class="control"><button class="btn primary" id="focus">ピントを合わせる</button></div>':'<p class="muted">気になるものがあれば、直接触ってみよう。</p>'}`);
if(f<3){$('focus').onclick=()=>{st.scopeFocus++;clickSound();save();scope()}}else{let star=$('eyeStar'),startY=0;star.addEventListener('pointerdown',e=>{startY=e.clientY;star.setPointerCapture(e.pointerId)});star.addEventListener('pointerup',e=>{if(Math.abs(e.clientY-startY)>10)takeEye()});star.onclick=takeEye}}
function takeEye(){if(st.eye)return;const el=$('eyeStar');if(el){el.disabled=true;el.style.opacity=0;let fly=document.createElement('span');fly.className='fly';fly.textContent='✦';$('scopeImage').appendChild(fly)}chime();setTimeout(()=>{st.eye=true;render();modal('望遠鏡',`<div class="scope lost"><img src="eye_empty.png" alt="光が消えた瞳"></div><p>……。</p><div class="control"><button class="btn" data-close>部屋に戻る</button></div>`);$('modal').querySelector('[data-close]').onclick=close;say([{name:'あなた',text:'……あれ？ セラが、動かない。'}]);},900)}
function restore(){if(st.restored)return;placeSound();const sc=$('scopeImage');if(sc){const el=sc.querySelector('.returning');if(el)el.style.display='block';}setTimeout(()=>{st.restored=true;st.cleared=true;st.eye=true;save();render();chime();modal('光が戻った',`<div class="scope"><img src="eye_lit.png" alt="星が戻った瞳"></div><p>瞳に光が灯り、セラがゆっくり瞬きをした。<br>望遠鏡から目を離して、あなたを振り向く。</p><div class="control"><button class="btn primary" id="reawake">セラに話しかける</button></div>`);$('reawake').onclick=()=>{close();say(['……あれ？ どうして、そんな顔してるの？','……星座、できたんだね。','……見せて。私も、見たい。','君と一緒に星座を見たかったんだ。'],()=>showEnding())}},1150)}
function showEnding(){$('end').hidden=false;music(false);$('songStatus').textContent='星空を見上げる二人。';$('endText').textContent='君と一緒に星座を見たかったんだ。';}
function drawSky(){const total=st.stars+(st.eye&&!st.restored?1:0),remaining=Math.max(0,total-st.placed.length);modal('ふたりの星座',`<p>集めた星を、夜空に並べよう。<span class="muted">本棚の背表紙で見た形を思い出して。</span></p><div class="sky" id="sky"><svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${points.map(x=>x.join(',')).join(' ')}" stroke="#fff2c0" stroke-width=".65" fill="none" opacity="${st.placed.length===6?1:0}"></polyline></svg>${points.map((p,i)=>`<button class="slot ${st.placed.includes(i)?'filled':''}" data-slot="${i}" aria-label="星の位置${i+1}" style="left:${p[0]}%;top:${p[1]}%">${st.placed.includes(i)?'✦':'·'}</button>`).join('')}</div><p style="text-align:center">星の保管箱　${remaining}個　｜　夜空　${st.placed.length}/6</p><div class="tray">${Array.from({length:remaining},()=>'<button class="tray-star" aria-label="星を選ぶ">✦</button>').join('')||'<span class="muted">保管箱は空</span>'}</div><p class="muted">星を選んで位置をタップ。配置した星をタップすると保管箱へ戻せるよ。</p><div class="control"><button class="btn" id="resetSky">星をすべて戻す</button></div>${st.meteor&&st.news&&!st.meteorStar?'<button class="btn primary" id="shoot" style="width:100%;margin-top:12px">🌠 流れ星が横切った！</button>':''}`);
let selected=true;document.querySelectorAll('.tray-star').forEach(b=>b.onclick=()=>{selected=true;b.style.background='#7774ab'});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.slot);if(st.placed.includes(i)){st.placed=st.placed.filter(n=>n!==i);placeSound()}else if(selected&&st.placed.length<total){st.placed.push(i);placeSound()}save();if(st.placed.length===6&&!st.cleared){st.cleared=true;chime();render();modal('星座が完成した',`<div class="sky" style="display:grid;place-items:center"><div style="font-size:40px;text-align:center;color:#fff0c6;text-shadow:0 0 16px white">✦　✦<br>　✦　✦<br>✦　✦</div></div><p>6つの光がつながって、ひとつの星座になった。</p><p>……セラから返事はない。</p><button class="btn" data-close>部屋に戻る</button>`);$('modal').querySelector('[data-close]').onclick=close;return}drawSky()});$('resetSky').onclick=()=>{st.placed=[];save();drawSky()};if($('shoot'))$('shoot').onclick=meteorTake}
function sky(){if(st.eye&&st.news&&!st.restored&&!st.meteorStar){const d=new Date();if(d.getHours()===0&&d.getMinutes()<5)st.meteor=true}drawSky()}
function meteorTake(){modal('流れ星',`<div class="pick-star" id="meteorArea" style="background:radial-gradient(#7e86c7,#1d274f 65%)"><button id="meteorButton" aria-label="流れ星から星を取り出す">☄</button></div><p>夜空を横切る光の中に、ちいさな星が見える。</p>`);$('meteorButton').onclick=()=>{st.meteorStar=true;st.meteor=false;chime();save();$('meteorArea').classList.add('gone');setTimeout(()=>{modal('もうひとつの星','<p>流れ星から白い星を取り出せた。<br>どこかで、これと同じ光を見た気がする。</p>');},600)}}
function inventory(){modal('もちもの',`<div class="paper">星の保管箱：${st.stars+(st.eye?1:0)-st.placed.length} 個<br>スタッフ室の鍵：${st.keys?'ある':'ない'}<br>テレビのリモコン：${st.remote?'ある':'ない'}<br>流れ星の星：${st.meteorStar?'ある':'ない'}</div>`)}
function inspect(id){if(st.room==='staff'){staffInspect(id);return}if(id==='books')bookshelf();if(id==='clock')chase();if(id==='window')sky();if(id==='scope')scope();if(id==='orb')polish();if(id==='notes')notes();if(id==='staff')staffDoor();if(id==='tv')tv();if(id==='shadow')shadows();if(id==='seed')seed();if(id==='sera')examineSera()}
$('openSky').onclick=()=>{if(st.room==='staff'){st.room='main';render()}sky()};$('bag').onclick=inventory;$('home').onclick=()=>{close();openTitle()};$('dev').onclick=()=>{if(!st.eye){say([{name:'システム',text:'流れ星のテストはセラの瞳の光を取った後に使える。'}]);return}st.meteor=true;st.news=true;save();say([{name:'システム',text:'流れ星が現れた。窓から空を見よう。'}])};
function openTitle(){$('title').hidden=false;$('title').classList.toggle('cleared',st.restored);$('titleSub').textContent=st.restored?'ふたりの星座は、今夜も輝いている。':'君と紡ぐ、ひとつの星座';$('start').textContent=st.restored?'もう一度、天文台へ':'ゲームをはじめる'}
$('start').onclick=()=>{$('title').hidden=true;music(true);render();if(!st.seenIntro){st.seenIntro=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日はね、君と一緒に星座を見たいんだ。','この部屋には、ちいさな星が隠れているよ。いろんなものを触って、見つけてみよう！','光る星が出てきたら、タップして拾ってね。星は保管箱に入るよ。','集めた星は窓の夜空に置けるの。形のヒントも、きっとどこかにあるはず！','……いつか、君と一緒に星座を見たかったんだ。だから、今日は楽しみにしてるね！'])}};
$('newGame').onclick=()=>{if(confirm('進行状況をすべて消して、はじめから遊ぶ？')){st=defaults();save();$('title').hidden=true;music(true);render();st.seenIntro=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日は君と一緒に星座を見たいんだ。部屋の仕掛けを見つけて、星を集めてね！'])}};
$('endHome').onclick=()=>{$('song').pause();$('end').hidden=true;openTitle()};$('endPlay').onclick=async()=>{const s=$('song');try{await s.play();$('songStatus').textContent='♪ 星座になれたら';$('endPlay').textContent='♪ 再生中';}catch(e){$('songStatus').textContent='歌唱音源は未配置です。ending_song.mp3 を同じフォルダに置くと再生できます。';$('endPlay').textContent='♪ もう一度再生を試す'}};$('song').onended=()=>{$('endPlay').textContent='♪ もう一度聴く'};
setInterval(()=>{if(st.eye&&st.news&&!st.restored&&!st.meteorStar){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5)st.meteor=true}},10000);render();openTitle();
})();
</script></body></html>
