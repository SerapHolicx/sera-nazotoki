:root{--ink:#141a3c;--night:#171c43;--violet:#7876c5;--cream:#fff1dc;--gold:#f5d78b;--line:#b6b4ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#41437c,#12152e 72%);color:#f8f3ff;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff}#app{max-width:900px;margin:auto;padding:14px 12px 30px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}.head h1{font-size:clamp(17px,4vw,26px);margin:0;letter-spacing:.1em;color:#fff0c9}.head small{font-size:11px;color:#d8d4ff}.chip{border:2px solid #d5b97b;background:#2c2d60;color:#fff2d1;padding:8px 10px;box-shadow:inset 0 0 0 2px #6865a5}.frame{border:5px solid #27234c;outline:2px solid #d7c18c;box-shadow:0 8px 0 #090d22, inset 0 0 0 2px #8b85c3;background:#23254e;padding:8px}.mapwrap{position:relative;overflow:hidden;background:#13152f;aspect-ratio: 16 / 10;touch-action:manipulation}.mapwrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.map-hit{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer}.map-hit:focus-visible{outline:3px dashed #fff}.hud{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}.stars{font-size:25px;letter-spacing:3px;color:#f8dc9d;text-shadow:0 0 8px #ffe6ad}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{background:#3a3b79;border:2px solid #e2c78f;box-shadow:inset 0 0 0 2px #6f6eb5;color:#fff5e0;padding:10px 13px;min-height:43px}.btn:active{transform:translateY(2px)}.dialog{margin-top:12px;display:flex;align-items:center;gap:12px;min-height:108px;background:#25244f;border:3px solid #c9b3dd;box-shadow:inset 0 0 0 3px #545189;padding:10px}.portrait{position:relative;width:86px;height:86px;flex:0 0 86px;overflow:hidden;border:2px solid #d4c4ec;background:#83dff2}.portrait img{position:absolute;width:100%;height:170%;object-fit:cover;object-p </style></head><body><div id="app"><header class="head"><div><small>THE YOIZORA OBSERVATORY</small><h1>✦ 宵空天文台 ✦</h1></div><button id="home" class="chip">タイトル</button><button id="sound" class="chip">♪ OFF</button><button id="reset" class="chip">はじめから</button></header><div class="frame"><div class="mapwrap" id="map"><canvas id="canvas" width="640" height="400" aria-label="天文台のドット絵マップ"></canvas></div><div class="hud"><div class="stars" id="stars">☆☆☆☆☆☆</div><div class="actions"><button class="btn" id="interact">しらべる</button><button class="btn" id="bag">もちもの</button><button class="btn" id="dev">DEV 🌠</button></div></div></div><div class="ctrl"><button class="empty">.</button><button data-move="up">▲</button><button class="empty">.</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="dialog"><div class="portrait"><img src="sera_reference.jpg" alt="宵空セラ"><span class="shine" id="portraitStar">✦</span></div><div><strong id="speaker">セラ</strong><p id="line">こんせら〜！ ようこそ、宵空天文台へ！ 星を集めて、ひとつの星座をつくろうね！</p></div></div><p class="hint">天文台のものをタップして調べよう。星は見つけたら自分で拾ってね。窓からはいつでも星座を作れるよ。</p></div><section id="titleScreen" class="title-screen" hidden><div class="title-bg"></div><div class="title-content"><div class="tiny">THE YOIZORA OBSERVATORY</div><h1>宵空天文台</h1><p id="titleStatus">君と紡ぐ、ひとつの星座</p><div class="title-constellation" aria-hidden="true"><svg viewBox="0 0 100 100"><polyline points="22,72 39,40 62,26 80,50 70,77 44,80" fill="none" stroke="#ffe7a8" stroke-width="1.5"/></svg></div><button class="btn" id="titleStart">ゲームをはじめる</button><p class="tiny">星を集めて、夜空に並べよう</p></div></section><section id="endingScreen" class="ending-screen" hidden><div class="ending-inner"><div class="ending-stars">✦　✧　✦</div><h2></h2><p></p><button class="btn" id="endNext">つづき ▶</button></div></section><div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),panel=$('panel');
const items=[{id:'books',name:'本棚',x:68,y:65,w:65,h:60},{id:'clock',name:'時計',x:283,y:40,w:55,h:50},{id:'chart',name:'星図',x:240,y:150,w:60,h:55},{id:'device',name:'天球儀',x:440,y:155,w:55,h:55},{id:'notes',name:'観測ノート',x:350,y:235,w:60,h:55},{id:'window',name:'窓',x:505,y:53,w:62,h:55},{id:'telescope',name:'望遠鏡',x:520,y:208,w:60,h:55},{id:'tv',name:'テレビ',x:65,y:240,w:60,h:55},{id:'staff',name:'スタッフ室',x:266,y:318,w:62,h:50},{id:'sera',name:'セラ',x:505,y:275,w:85,h:48}];
let s={done:{},stars:0,eye:false,placed:[],remote:false,channel:0,news:false,meteor:false,meteorTaken:false,restored:false,staff:false,pos:{x:185,y:310},bookOrder:[],bookPick:-1,pending:null};
try{const v=JSON.parse(localStorage.getItem('sera-observatory-2026-v2'));if(v&&v.done)s={...s,...v}}catch(e){}
const save=()=>localStorage.setItem('sera-observatory-2026-v2',JSON.stringify(s));
function say(t,who='セラ'){ $('speaker').textContent=who;$('line').textContent=t; }
function refresh(){let n=s.stars+(s.eye?1:0);$('stars').textContent='★'.repeat(n)+'☆'.repeat(6-n);$('portraitStar').hidden=s.eye&&!s.restored;draw();save()}
function pixelRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
const mapArt=new Image();mapArt.src='map.png';mapArt.onload=()=>draw();
function draw(){ctx.imageSmoothingEnabled=false;ctx.fillStyle='#20254d';ctx.fillRect(0,0,640,400);
if(mapArt.complete&&mapArt.naturalWidth)ctx.drawImage(mapArt,0,0,640,400);
// Clear, game-like interactive markers; art is decorative and objects are tappable.
const marks=[['books',100,92],['clock',310,64],['chart',265,173],['device',464,178],['notes',375,258],['window',535,78],['telescope',550,235],['tv',95,266],['staff',296,342]];
const pulse=0.75+0.25*Math.sin(Date.now()/370);
for(const [id,x,y] of marks){if(id==='staff'&&s.eye){ctx.fillStyle='#fff0b9';ctx.fillRect(x-3,y-4,6,9)}ctx.save();ctx.translate(x,y);ctx.globalAlpha=pulse;ctx.shadowBlur=12;ctx.shadowColor='#ffe9a2';ctx.fillStyle='#fff4ca';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(4,-4);ctx.lineTo(12,0);ctx.lineTo(4,4);ctx.lineTo(0,12);ctx.lineTo(-4,4);ctx.lineTo(-12,0);ctx.lineTo(-4,-4);ctx.closePath();ctx.fill();ctx.restore()}
// Sera is a distinct lavender-haired guide. After five stars she walks to the telescope.
let sx=s.stars>=5?525:430, sy=s.stars>=5?212:285;
if(typeof seraWalkStart!=='undefined'&&seraWalkStart&&s.stars>=5){let t=Math.min(1,(Date.now()-seraWalkStart)/2300);sx=430+95*t;sy=285-73*t;if(t===1)seraWalkStart=0;}
ctx.save();ctx.translate(sx,sy);ctx.fillStyle='#262450';ctx.fillRect(-13,-18,26,12);ctx.fillStyle='#f6d89e';ctx.fillRect(-10,-21,20,3);ctx.fillStyle='#c6c2ff';ctx.fillRect(-13,-6,26,23);ctx.fillStyle='#eee9ff';ctx.fillRect(-15,4,30,11);ctx.fillStyle='#b4baff';ctx.fillRect(-11,-15,22,15);ctx.fillStyle='#f5e6eb';ctx.fillRect(-7,-9,14,12);ctx.fillStyle='#9b99e2';ctx.fillRect(-12,15,8,8);ctx.fillRect(4,15,8,8);ctx.fillStyle='#fff';ctx.fillRect(-18,-13,7,6);ctx.fillRect(11,-13,7,6);ctx.restore();
// Visitor: dark navy + teal, deliberately unlike Sera.
let p=s.pos;ctx.fillStyle='#111b36';ctx.fillRect(p.x-13,p.y-17,26,15);ctx.fillStyle='#3c9eab';ctx.fillRect(p.x-10,p.y-11,20,16);ctx.fillStyle='#f2d5c5';ctx.fillRect(p.x-8,p.y-8,16,12);ctx.fillStyle='#173c58';ctx.fillRect(p.x-12,p.y+4,24,20);ctx.fillStyle='#7ac9c4';ctx.fillRect(p.x-10,p.y+8,20,3);ctx.fillStyle='#121d36';ctx.fillRect(p.x-9,p.y+23,7,8);ctx.fillRect(p.x+3,p.y+23,7,8);
if(s.eye&&!s.restored){ctx.fillStyle='#10132955';ctx.fillRect(0,0,640,400)}
}
function show(html){panel.innerHTML=html;overlay.hidden=false;panel.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){overlay.hidden=true;refresh()}function shell(title,body){show(`<button class="btn close" data-close>×</button><h2>${title}</h2>${body}`)}
function reward(id){if(s.done[id])return;s.pending=id;save();say('わあ！ 星が現れたよ。拾ってみて！');shell('✦ 星が現れた',`<p>白く輝く星が、目の前に浮かんでいる。</p><button class="pickup" id="pickup" aria-label="星を拾う">✦</button><p class="mini">星をタップして拾おう。</p>`);$('pickup').onclick=()=>{if(!s.pending)return;let id=s.pending;s.pending=null;s.done[id]=true;s.stars++;refresh();if(s.stars===5)say('5つ集まったね！ ちょっと望遠鏡を覗いてみるね。');else say('やった！ またひとつ見つけたね！');shell('✦ 星を拾った！',`<p>星が保管箱に収まった。いまは <strong>${s.stars}/5</strong> 個。</p><p>窓から夜空を見れば、いつでも星を並べられる。</p><button class="btn" data-close>部屋に戻る</button>`)};}
const bookTexts=['朝の光が差し込み、観測が始まった。','太陽が高く昇り、機材を点検した。','夕日が沈み、空が茜色に染まった。','夜の帳が下り、最初の星が現れた。','真夜中、空いっぱいに星が輝いた。','夜が明け、観測を終えた。'];let order=[3,1,5,0,4,2];
function books(){if(s.done.books){shell('📚 本棚','<p>並べた本はそのままになっている。背表紙には、細い金色の模様がつながっている。</p><div class="paper">✦　　✦<br>　　✦　　✦<br>✦　　　　✦</div><p class="mini">この模様は、どこかで役に立つかもしれない。</p>');return}let list=order.map((v,i)=>`<button class="book" data-b="${i}">${bookTexts[v]}</button>`).join('');shell('📚 本棚 — 物語を並べる',`<p>6冊の観測日誌がバラバラになっている。中身を読んで、出来事の順に並べよう。<br><span class="mini">2冊を順番にタップすると、場所を交換できるよ。</span></p><div class="booklist" id="booklist">${list}</div><p id="bookmsg" class="mini">本の中身を読んでみよう。</p><div class="row"><button class="btn" id="bookcheck">この順番で決定</button></div>`);panel.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{let i=+b.dataset.b;if(s.bookPick<0){s.bookPick=i;b.classList.add('selected')}else{[order[i],order[s.bookPick]]=[order[s.bookPick],order[i]];s.bookPick=-1;books()}});$('bookcheck').onclick=()=>{if(order.every((v,i)=>v===i)){reward('books')}else $('bookmsg').textContent='まだ物語の順番が違うみたい。'} }
function clock(){if(s.done.clock)return shell('🕰 時計','<p>時計は正しい時刻を指している。</p>');shell('🕰 時計 — 失われた時刻',`<div class="paper">観測メモ：月が半分から満月になるまで、あと2時間。<br>月が満ちるのは午後10時。<br>観測開始の時刻に針を合わせよ。</div><p>時計を何時に合わせる？</p><div class="row">${[6,8,10,12].map(n=>`<button class="btn" data-hour="${n}">${n}時</button>`).join('')}</div><p id="clockmsg" class="mini"></p>`);panel.querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>{if(+b.dataset.hour===8){reward('clock')}else $('clockmsg').textContent='観測メモをもう一度読もう。'})}
function chart(){if(s.done.chart)return shell('🗺 星図','<p>2枚の星図は重なって、ひとつの星を示している。</p>');shell('🗺 星図 — 重なった先の星',`<div class="paper">星図A：上段の左と中央、下段の右に印。<br>星図B：上段の中央と右、下段の左に印。<br><br>両方の星図に印がある場所は？</div><div class="row">${['上段左','上段中央','上段右','下段左','下段右'].map((x,i)=>`<button class="btn" data-choice="${i}">${x}</button>`).join('')}</div><p id="chartmsg" class="mini"></p>`);panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(+b.dataset.choice===1){reward('chart')}else $('chartmsg').textContent='両方に共通する場所を探そう。'})}
function device(){if(s.done.device)return shell('⚙ 天球儀','<p>天球儀は静かに回っている。</p>');shell('⚙ 天球儀 — 観測装置の調整',`<div class="paper">観測装置の設定：<br>「太陽が沈み、月が昇り、星が輝く」<br>この順番でスイッチを押す。</div><div class="row">${[['☀','sun'],['☾','moon'],['✦','star']].map(([a,b])=>`<button class="btn" data-switch="${b}">${a}</button>`).join('')}</div><p id="devmsg" class="mini">入力：なし</p>`);let seq=[];panel.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{seq.push(b.dataset.switch);$('devmsg').textContent='入力：'+seq.join(' → ');if(seq.length===3){if(seq.join(',')==='sun,moon,star'){reward('device')}else{seq=[];$('devmsg').textContent='順番が違うみたい。もう一度！'}}})}
function notes(){if(s.done.notes)return shell('📓 観測ノート','<p>欠けていた記録は埋まっている。</p>');shell('📓 観測ノート — 記録の整理',`<div class="paper">観測記録：<br>1日目　月：細い<br>2日目　月：半分<br>3日目　月：？<br>4日目　月：半分<br>5日目　月：細い<br><br>同じ周期で変化している。3日目の月は？</div><div class="row">${['新月','満月','三日月'].map((x,i)=>`<button class="btn" data-moon="${i}">${x}</button>`).join('')}</div><p id="notemsg" class="mini"></p>`);panel.querySelectorAll('[data-moon]').forEach(b=>b.onclick=()=>{if(+b.dataset.moon===1){reward('notes')}else $('notemsg').textContent='月の形の変化を考えてみよう。'})}
const nodes=[[22,72],[39,40],[62,26],[80,50],[70,77],[44,80]];
function sky(){let n=s.stars+(s.eye?1:0);let remain=Math.max(0,n-s.placed.length);let html=`<p>星を保管箱から夜空へ。好きなときに配置できるよ。</p><div class="sky" id="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${nodes.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e9d5ac" stroke-width=".5" opacity="${s.placed.length===6?1:.0}"/></svg>${nodes.map((p,i)=>`<button class="node ${s.placed.includes(i)?'filled':''}" style="left:${p[0]}%;top:${p[1]}%" data-node="${i}" aria-label="星の場所${i+1}">${s.placed.includes(i)?'✦':'·'}</button>`).join('')}</div><p class="inventory">保管箱　${remain} 個　｜　夜空　${s.placed.length}/6</p><div id="tray">${Array.from({length:remain},(_,i)=>`<button class="traystar" data-tray="${i}" aria-label="星を選ぶ">✦</button>`).join('')||'<span class="mini">保管箱は空っぽ</span>'}</div><p class="mini">保管箱の星を選んで、夜空の場所をタップ。ドラッグして置くこともできる。置いた星はタップで戻せるよ。</p><div class="row"><button class="btn" id="skyreset">全部戻す</button><button class="btn" data-close>部屋へ戻る</button></div>`;
shell('🌌 星座をつくる',html);
let selected=remain>0;
const place=i=>{if(s.placed.includes(i)){s.placed=s.placed.filter(x=>x!==i)}else if(s.placed.length<n){s.placed.push(i)}else return;save();if(s.placed.length===6){s.staff=true;say('…………');shell('✦ 星座が完成した',`<p>6つの光が、夜空でつながった。</p><p>……望遠鏡を覗いたセラは、動かない。</p><button class="btn" data-close>部屋へ戻る</button>`);return}sky()};
panel.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>place(+b.dataset.node));
panel.querySelectorAll('[data-tray]').forEach(b=>{b.onclick=()=>{selected=true;b.style.background='#8172b4'};b.addEventListener('pointerdown',e=>{b.dataset.drag='1';b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{if(!b.dataset.drag)return;let skyEl=$('sky'),r=skyEl.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;let candidates=nodes.map((p,i)=>({i,d:Math.hypot(p[0]-x,p[1]-y)})).filter(v=>!s.placed.includes(v.i)).sort((a,b)=>a.d-b.d);if(candidates.length)place(candidates[0].i)}})});
$('skyreset').onclick=()=>{s.placed=[];sky()};}
function telescope(){if(s.stars<5&&!s.eye)return say('セラはまだ観測の準備をしているみたい。星を集めよう！');if(s.restored)return shell('🔭 望遠鏡','<p>セラが笑っている。瞳には白い星が輝いている。</p>');let empty=s.eye;let img=`<div class="lens ${empty?'empty':''}"><img src="sera_reference.jpg" alt="望遠鏡越しに見えるセラの瞳">${empty?'':`<button class="eye-star" id="eyeTake" aria-label="瞳の白い星を取る">★</button>`}</div>`;shell('🔭 望遠鏡',`${img}<p class="mini">${empty?'セラは望遠鏡を覗いたまま、動かない。': '望遠鏡を覗くセラの瞳に、白い星が浮かんでいる。'}</p>${empty&&s.meteorTaken?'<div class="row"><button class="btn" id="restore">流れ星の星を瞳に戻す</button></div>':''}`);if(!empty){let btn=$('eyeTake');btn.onclick=takeEye;btn.addEventListener('pointerdown',e=>{btn.setPointerCapture(e.pointerId);btn.dataset.startY=e.clientY});btn.addEventListener('pointerup',e=>{if(Math.abs(e.clientY-(+btn.dataset.startY))>15)takeEye()})}if(empty&&s.meteorTaken)$('restore').onclick=restore}
function takeEye(){if(s.eye)return;s.eye=true;say('…………');refresh();shell('🔭 望遠鏡',`<div class="lens empty"><img src="sera_reference.jpg" alt="光を失った瞳"></div><p>…………</p><button class="btn" data-close>戻る</button>`)}
function restore(){s.restored=true;s.meteor=false;s.meteorTaken=false;refresh();say('……あれ？　星座、できたんだね。\n君と一緒に星座を見たかったんだ。');shell('✦ ふたりの星座',`<p>白い星が瞳に戻ると、セラはゆっくり顔を上げた。</p><p>「……あれ？　星座、できたんだね。」</p><p><strong>「君と一緒に星座を見たかったんだ。」</strong></p><p>窓の外には、ふたりで作った星座が輝いている。</p><div class="row"><button class="btn" id="ending">エンディングを見る ♪</button></div>`);$('ending').onclick=()=>startEnding()}
function staff(){if(!s.eye)return say('そこはスタッフ専用だよ〜。お客さんはこっち！');s.staff=true;say('…………');
shell('スタッフ室',`<div class="staffscene" id="staffscene"><img src="staff_art.png" alt="スタッフ室のドット絵"><button class="spot" style="left:17%;top:44%" data-staff="shelf">✧</button><button class="spot" style="left:52%;top:53%" data-staff="desk">✧</button><button class="spot" style="left:85%;top:40%" data-staff="cabinet">✧</button></div><p id="staffmsg">静かなスタッフ室。机と本棚、戸棚を調べられそう。</p><div class="row"><button class="btn" data-close>天文台へ戻る</button></div>`);
panel.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{let id=b.dataset.staff;if(id==='shelf')$('staffmsg').textContent='観測記録：「星は、空にあるものだけではない」。セラの瞳を思い出した。';if(id==='desk')$('staffmsg').textContent='セラのメモ。「星座が完成したら、あの子と一緒に見よう。楽しみだな」。';if(id==='cabinet'){s.remote=true;save();$('staffmsg').textContent='戸棚の中からリモコンを見つけた。これでテレビを操作できそう。';b.textContent='✓'}})}
function tv(){if(!s.remote)return shell('📺 テレビ','<div class="news"><h3>バラエティ番組</h3><p>今夜のおすすめスイーツ特集！</p></div><p>リモコンが見当たらない。チャンネルは変えられない。</p>');let channels=[['バラエティ番組','今夜のおすすめスイーツ特集！'],['天気予報','今夜は雲が少なく、星空が広がるでしょう。'],['ニュース速報','今夜、流星群が見頃を迎えます。ピークは午前0時ごろ。'],['通販番組','星形のクッション、好評発売中！']];let c=channels[s.channel];shell('📺 テレビ',`<div class="news"><h3>${c[0]}</h3><p>${c[1]}</p></div><div class="row"><button class="btn" id="prev">◀ CH</button><button class="btn" id="next">CH ▶</button></div>`);if(s.channel===2){s.news=true;save()}$('prev').onclick=()=>{s.channel=(s.channel+3)%4;tv()};$('next').onclick=()=>{s.channel=(s.channel+1)%4;tv()}}
function windowLook(){if(s.meteor&&s.eye&&!s.restored){shell('🌠 流れ星',`<div class="sky" style="height:190px;text-align:center;padding-top:40px;font-size:65px;color:#fff8bd;text-shadow:0 0 30px white">☄</div><p>流れ星が夜空を横切った。その光の中に、白い星が見える。</p><div class="row"><button class="btn" id="getMeteor">白い星を取る</button></div>`);$('getMeteor').onclick=()=>{s.meteorTaken=true;s.meteor=false;say('…………');shell('✦ 流れ星の星を手に入れた','<p>白い星が手元に残った。……どこかに戻せるだろうか。</p>');save()};return}sky()}
function bag(){shell('🎒 もちもの',`<p>集めた星：${s.stars} 個<br>瞳から取った星：${s.eye?'1 個':'なし'}<br>テレビのリモコン：${s.remote?'あり':'なし'}<br>流れ星のニュース：${s.news?'見た':'まだ'}<br>流れ星の星：${s.meteorTaken?'あり':'なし'}</p>`)}
function inspect(id){if(id==='sera'){if(s.eye&&!s.restored)return say('…………');return say('星が集まったら、窓から夜空を見てみよう！')}if(id==='books')return books();if(id==='clock')return clock();if(id==='chart')return chart();if(id==='device')return device();if(id==='notes')return notes();if(id==='window')return windowLook();if(id==='telescope')return telescope();if(id==='staff')return staff();if(id==='tv')return tv()}
function near(){let p=s.pos;let sorted=items.map(it=>({it,d:Math.hypot(p.x-(it.x+it.w/2),p.y-(it.y+it.h/2))})).sort((a,b)=>a.d-b.d);return sorted[0].it.id}
function move(dx,dy){s.pos.x=Math.max(20,Math.min(620,s.pos.x+dx));s.pos.y=Math.max(145,Math.min(350,s.pos.y+dy));draw();save()}
canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*400/r.height;let hit=items.find(it=>x>=it.x-10&&x<=it.x+it.w+10&&y>=it.y-10&&y<=it.y+it.h+10);if(hit)inspect(hit.id);else{s.pos={x:Math.max(20,Math.min(620,x)),y:Math.max(145,Math.min(350,y))};draw()}});
$('interact').onclick=()=>inspect(near());$('bag').onclick=bag;$('dev').onclick=()=>{if(!s.eye){say('まずは星を集めてみよう！');return}s.meteor=true;say('…………');save();shell('🛠 DEV：流れ星を出現させた','<p>窓から夜空を見てみよう。流れ星が現れている。</p>')};$('reset').onclick=()=>{if(confirm('進行状況を消して最初から始める？')){localStorage.removeItem('sera-observatory-2026-v2');location.reload()}};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d=b.dataset.move;move(d==='left'?-22:d==='right'?22:0,d==='up'?-22:d==='down'?22:0)});document.addEventListener('keydown',e=>{if(!overlay.hidden)return;let k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault();move(k==='ArrowLeft'?-22:k==='ArrowRight'?22:0,k==='ArrowUp'?-22:k==='ArrowDown'?22:0)}if(k==='Enter'||k===' ')inspect(near())});overlay.addEventListener('click',e=>{if(e.target===overlay)close()});

let seraWalkStart=0;const origReward=reward;
// Transition to telescope after collecting fifth star.
// Music is synthesized locally; no copyrighted track is bundled.
let audioCtx=null,musicTimer=null,musicOn=false,musicStep=0;
function tone(f,d=.24,v=.025){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.01)}
function startMusic(){if(musicOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicOn=true;musicTimer=setInterval(()=>{const melody=s.eye&&!s.restored?[392,0,349,0,330,0,294,0]:[523,659,784,659,587,659,523,392];let f=melody[musicStep++%melody.length];if(f)tone(f,.45,.018)},420);$('sound').textContent='♪ ON'}catch(e){}}
function toggleMusic(){if(musicOn){clearInterval(musicTimer);musicOn=false;$('sound').textContent='♪ OFF'}else startMusic()}
$('sound').onclick=toggleMusic;
function openTitle(){const cleared=localStorage.getItem('sera-finished')==='1';$('titleScreen').hidden=false;$('titleScreen').classList.toggle('cleared',cleared);$('titleStatus').textContent=cleared?'ふたりの星座は、今夜も輝いている。':'君と紡ぐ、ひとつの星座';$('titleStart').textContent=cleared?'もう一度、天文台へ':'ゲームをはじめる'}
$('titleStart').onclick=()=>{$('titleScreen').hidden=true;startMusic()};
$('home').onclick=()=>{overlay.hidden=true;openTitle()};
function startEnding(){s.restored=true;localStorage.setItem('sera-finished','1');save();overlay.hidden=true;const e=$('endingScreen');e.hidden=false;let frames=[['光が、戻ってきた。','星は再びセラの瞳に灯った。'],['……あれ？','セラがゆっくり顔を上げる。'],['君と一緒に、星座を見たかったんだ。','窓の外には、ふたりで作った星座。'],['星座になれたら','ふたりの夜空に、光がつながった。']];let n=0;function showFrame(){e.querySelector('h2').textContent=frames[n][0];e.querySelector('p').textContent=frames[n][1];e.classList.toggle('last',n===3);$('endNext').textContent=n===3?'タイトルへ戻る':'つづき ▶';if(musicOn)tone([523,659,784,1047][n],.8,.05)}showFrame();$('endNext').onclick=()=>{if(n<3){n++;showFrame()}else{e.hidden=true;openTitle()}}}
// Repeat while holding a directional button; pointerup stops on mobile.
let held=null;document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();let d=b.dataset.move;const tick=()=>move(d==='left'?-9:d==='right'?9:0,d==='up'?-9:d==='down'?9:0);tick();clearInterval(held);held=setInterval(tick,65)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{clearInterval(held);held=null}))});
const _refresh=refresh;refresh=function(){_refresh();if(s.stars>=5&&!window.seenFive){window.seenFive=true;seraWalkStart=Date.now();setTimeout(()=>draw(),300);setTimeout(()=>draw(),700);setTimeout(()=>draw(),1300);setTimeout(()=>draw(),2400)}};
setInterval(()=>{if(!$('titleScreen').hidden||!overlay.hidden)return;draw()},180);
openTitle();
refresh();if(s.eye&&!s.restored)say('…………');if(s.restored)say('君と一緒に星座を見たかったんだ。');
// midnight appearance while observing, for local device time
setInterval(()=>{if(s.eye&&!s.restored&&s.news){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5)s.meteor=true}},20000);
