</style></head><body><div id="app"><header class="head"><div><small>THE YOIZORA OBSERVATORY</small><h1>✦ 宵空天文台 ✦</h1></div><button id="reset" class="chip">はじめから</button></header><div class="frame"><div class="mapwrap" id="map"><canvas id="canvas" width="640" height="400" aria-label="天文台のドット絵マップ"></canvas></div><div class="hud"><div class="stars" id="stars">☆☆☆☆☆☆</div><div class="actions"><button class="btn" id="interact">しらべる</button><button class="btn" id="bag">もちもの</button><button class="btn" id="dev">DEV 🌠</button></div></div></div><div class="ctrl"><button class="empty">.</button><button data-move="up">▲</button><button class="empty">.</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="dialog"><div class="portrait"><img src="sera_reference.jpg" alt="宵空セラ"><span class="shine" id="portraitStar">✦</span></div><div><strong id="speaker">セラ</strong><p id="line">こんせら〜！ ようこそ、宵空天文台へ！ 星を集めて、ひとつの星座をつくろうね！</p></div></div><p class="hint">マップの物をタップして調べられるにゃ。方向キー・キーボードの矢印でも歩けるよ。星座は窓から作れるよ。</p></div><div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div><script>

try{const v=JSON.parse(localStorage.getItem('sera-observatory-2026'));if(v&&v.done)s={...s,...v}}catch(e){}

function say(t,who='セラ'){ $('speaker').textContent=who;$('line').textContent=t; }
function refresh(){let n=s.stars+(s.eye?1:0);$('stars').textContent='★'.repeat(n)+'☆'.repeat(6-n);$('portraitStar').hidden=s.eye&&!s.restored;draw();save()}

// windows with moon and stars
for(let i=0;i<3;i++){let x=466+i*48;pixelRect(x,34,42,99,'#d8c3ac');pixelRect(x+5,40,32,86,'#1d2454');pixelRect(x+20,40,3,86,'#8b84b5');pixelRect(x+5,85,32,3,'#8b84b5');pixelRect(x+10,56,4,4,'#fff1b5');pixelRect(x+29,72,3,3,'#fff1b5')}
// bookshelf
pixelRect(46,37,163,100,'#352943');pixelRect(51,41,153,90,'#a88773');pixelRect(56,47,143,78,'#392c52');for(let i=0;i<12;i++){let c=['#7d7fc2','#c28aa8','#e0b57e','#6868aa'][i%4];pixelRect(61+i*11,52,9,69,c);pixelRect(61+i*11,61,9,3,'#e6d7b2');pixelRect(61+i*11,111,9,3,'#e6d7b2')}pixelRect(50,128,155,9,'#d5b18c');
// clock
pixelRect(291,29,65,78,'#cba77f');pixelRect(297,34,53,65,'#342c62');ctx.fillStyle='#ead5a5';ctx.beginPath();ctx.arc(323,65,24,0,7);ctx.fill();ctx.strokeStyle='#584b76';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(323,65);ctx.lineTo(323,44);ctx.moveTo(323,65);ctx.lineTo(338,74);ctx.stroke();
// table and charts
pixelRect(185,167,170,87,'#72536d');pixelRect(190,174,160,62,'#d1b39a');pixelRect(207,183,110,47,'#393d78');for(let i=0;i<9;i++){pixelRect(213+(i*19)%97,188+(i*13)%35,3,3,'#f5e6a6')}pixelRect(198,250,17,48,'#6c4b65');pixelRect(328,250,17,48,'#6c4b65');
// armillary
pixelRect(452,211,10,52,'#d9b681');ctx.strokeStyle='#e6c894';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(457,179,32,25,0,0,7);ctx.ellipse(457,179,17,32,.5,0,7);ctx.stroke();pixelRect(439,262,38,7,'#d9b681');
// telescope
pixelRect(508,244,76,18,'#b9a5c4');pixelRect(500,237,83,16,'#d6c2c9');pixelRect(573,231,15,30,'#594c83');pixelRect(543,258,8,45,'#d8b487');pixelRect(524,301,45,6,'#d8b487');
// television
pixelRect(34,222,121,82,'#c6a98d');pixelRect(41,229,93,65,'#1b2557');pixelRect(48,237,80,50,'#4a4c88');pixelRect(141,240,5,6,'#f4dca1');pixelRect(141,254,5,6,'#f4dca1');
// staff door
pixelRect(245,302,106,83,'#3c315b');pixelRect(255,309,87,76,'#8d7595');pixelRect(265,315,68,70,'#473b67');pixelRect(320,349,5,5,'#e9c78b');
// sera small character with wing headband
let sx=544,sy=310;pixelRect(sx-15,sy-19,31,22,'#c8c5ef');pixelRect(sx-17,sy-25,34,8,'#fff4e9');pixelRect(sx-11,sy-10,22,16,'#f9e7e5');pixelRect(sx-16,sy+5,32,21,'#b4b9f3');pixelRect(sx-23,sy-17,9,11,'#f9f7ff');pixelRect(sx+16,sy-17,9,11,'#f9f7ff');pixelRect(sx-10,sy+25,8,9,'#eee7ff');pixelRect(sx+3,sy+25,8,9,'#eee7ff');pixelRect(sx-7,sy-5,3,3,'#3c3b5d');pixelRect(sx+6,sy-5,3,3,'#3c3b5d');if(!s.eye||s.restored)pixelRect(sx-7,sy-6,2,2,'white');
// player
let p=s.pos;pixelRect(p.x-11,p.y-17,22,17,'#4a426f');pixelRect(p.x-8,p.y-11,16,16,'#ead4c9');pixelRect(p.x-13,p.y+5,26,20,'#e9dfd8');pixelRect(p.x-10,p.y+24,8,8,'#343354');pixelRect(p.x+3,p.y+24,8,8,'#343354');pixelRect(p.x-5,p.y-4,3,3,'#3b3551');pixelRect(p.x+5,p.y-4,3,3,'#3b3551');
if(s.eye&&!s.restored){pixelRect(0,0,640,6,'#27223e');pixelRect(0,379,640,6,'#27223e')}
}
function show(html){panel.innerHTML=html;overlay.hidden=false;panel.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){overlay.hidden=true;refresh()}function shell(title,body){show(`<button class="btn close" data-close>×</button><h2>${title}</h2>${body}`)}
function reward(id){if(s.done[id])return;s.done[id]=true;s.stars++;say(['すごい！ 星がひとつ増えたね！','やったね！ 観測が進んだよ！','正解！ きらきらだ〜！'][s.stars%3]);refresh()}
const bookTexts=['朝の光が差し込み、観測が始まった。','太陽が高く昇り、機材を点検した。','夕日が沈み、空が茜色に染まった。','夜の帳が下り、最初の星が現れた。','真夜中、空いっぱいに星が輝いた。','夜が明け、観測を終えた。'];let order=[3,1,5,0,4,2];
function books(){if(s.done.books){shell('📚 本棚','<p>並べた本はそのままになっている。背表紙には、細い金色の模様がつながっている。</p><div class="paper">✦　　✦<br>　　✦　　✦<br>✦　　　　✦</div><p class="mini">この模様は、どこかで役に立つかもしれない。</p>');return}let list=order.map((v,i)=>`<button class="book" data-b="${i}">${bookTexts[v]}</button>`).join('');shell('📚 本棚 — 物語を並べる',`<p>6冊の観測日誌がバラバラになっている。中身を読んで、出来事の順に並べよう。<br><span class="mini">2冊を順番にタップすると、場所を交換できるよ。</span></p><div class="booklist" id="booklist">${list}</div><p id="bookmsg" class="mini">本の中身を読んでみよう。</p><div class="row"><button class="btn" id="bookcheck">この順番で決定</button></div>`);panel.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{let i=+b.dataset.b;if(s.bookPick<0){s.bookPick=i;b.classList.add('selected')}else{[order[i],order[s.bookPick]]=[order[s.bookPick],order[i]];s.bookPick=-1;books()}});$('bookcheck').onclick=()=>{if(order.every((v,i)=>v===i)){reward('books');shell('✦ 星を発見！','<p>本棚の下から、白く輝く星が現れた！</p><p>本の背表紙にも、何か模様が浮かび上がっている。</p>')}else $('bookmsg').textContent='まだ物語の順番が違うみたい。'} }
function clock(){if(s.done.clock)return shell('🕰 時計','<p>時計は正しい時刻を指している。</p>');shell('🕰 時計 — 失われた時刻',`<div class="paper">観測メモ：月が半分から満月になるまで、あと2時間。<br>月が満ちるのは午後10時。<br>観測開始の時刻に針を合わせよ。</div><p>時計を何時に合わせる？</p><div class="row">${[6,8,10,12].map(n=>`<button class="btn" data-hour="${n}">${n}時</button>`).join('')}</div><p id="clockmsg" class="mini"></p>`);panel.querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>{if(+b.dataset.hour===8){reward('clock');shell('✦ 星を発見！','<p>カチッ。時計の裏から星が転がり出てきた！</p>')}else $('clockmsg').textContent='観測メモをもう一度読もう。'})}
function chart(){if(s.done.chart)return shell('🗺 星図','<p>2枚の星図は重なって、ひとつの星を示している。</p>');shell('🗺 星図 — 重なった先の星',`<div class="paper">星図A：上段の左と中央、下段の右に印。<br>星図B：上段の中央と右、下段の左に印。<br><br>両方の星図に印がある場所は？</div><div class="row">${['上段左','上段中央','上段右','下段左','下段右'].map((x,i)=>`<button class="btn" data-choice="${i}">${x}</button>`).join('')}</div><p id="chartmsg" class="mini"></p>`);panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(+b.dataset.choice===1){reward('chart');shell('✦ 星を発見！','<p>重なった印が光り、星が現れた！</p>')}else $('chartmsg').textContent='両方に共通する場所を探そう。'})}
function device(){if(s.done.device)return shell('⚙ 天球儀','<p>天球儀は静かに回っている。</p>');shell('⚙ 天球儀 — 観測装置の調整',`<div class="paper">観測装置の設定：<br>「太陽が沈み、月が昇り、星が輝く」<br>この順番でスイッチを押す。</div><div class="row">${[['☀','sun'],['☾','moon'],['✦','star']].map(([a,b])=>`<button class="btn" data-switch="${b}">${a}</button>`).join('')}</div><p id="devmsg" class="mini">入力：なし</p>`);let seq=[];panel.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{seq.push(b.dataset.switch);$('devmsg').textContent='入力：'+seq.join(' → ');if(seq.length===3){if(seq.join(',')==='sun,moon,star'){reward('device');shell('✦ 星を発見！','<p>天球儀が回り、中心から星が浮かび上がった！</p>')}else{seq=[];$('devmsg').textContent='順番が違うみたい。もう一度！'}}})}
function notes(){if(s.done.notes)return shell('📓 観測ノート','<p>欠けていた記録は埋まっている。</p>');shell('📓 観測ノート — 記録の整理',`<div class="paper">観測記録：<br>1日目　月：細い<br>2日目　月：半分<br>3日目　月：？<br>4日目　月：半分<br>5日目　月：細い<br><br>同じ周期で変化している。3日目の月は？</div><div class="row">${['新月','満月','三日月'].map((x,i)=>`<button class="btn" data-moon="${i}">${x}</button>`).join('')}</div><p id="notemsg" class="mini"></p>`);panel.querySelectorAll('[data-moon]').forEach(b=>b.onclick=()=>{if(+b.dataset.moon===1){reward('notes');shell('✦ 星を発見！','<p>観測ノートのページの間に、星が挟まっていた！</p>')}else $('notemsg').textContent='月の形の変化を考えてみよう。'})}
const nodes=[[22,72],[39,40],[62,26],[80,50],[70,77],[44,80]];
function sky(){let n=s.stars+(s.eye?1:0);let html=`<p>集めた星を、夜空に並べよう。星の位置は本棚にヒントがあるかも。</p><div class="sky" id="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${nodes.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#666a9b" stroke-width=".45" stroke-dasharray="1 3" opacity="${s.placed.length===6?1:0}"/></svg>${nodes.map((p,i)=>`<button class="node ${s.placed.includes(i)?'filled':''}" style="left:${p[0]}%;top:${p[1]}%" data-node="${i}" aria-label="星の位置${i+1}">${s.placed.includes(i)?'★':'·'}</button>`).join('')}</div><p class="inventory">手元の星：${Math.max(0,n-s.placed.length)} 個　／　配置：${s.placed.length}/6</p><p class="mini">点線は星を置ける範囲の目印。星の形を考えながら配置してね。</p><div class="row"><button class="btn" id="skyreset">星を戻す</button><button class="btn" id="skyclose" data-close>部屋に戻る</button></div>`;shell('🌌 星座をつくる',html);panel.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let i=+b.dataset.node;if(s.placed.includes(i)){s.placed=s.placed.filter(x=>x!==i)}else if(s.placed.length<n){s.placed.push(i)}else return;save();if(s.placed.length===6){s.staff=true;say('…………');shell('✦ 星座が完成した',`<p>6つの星が、夜空でひとつにつながった。</p><p>……望遠鏡を覗いているセラは、動かない。</p><div class="row"><button class="btn" data-close>部屋に戻る</button></div>`);return}sky()});$('skyreset').onclick=()=>{s.placed=[];sky()}}
function telescope(){if(s.restored)return shell('🔭 望遠鏡','<p>セラが笑っている。瞳には白い星が輝いている。</p>');let empty=s.eye;let img=`<div class="lens ${empty?'empty':''}"><img src="sera_reference.jpg" alt="望遠鏡越しに見えるセラの瞳">${empty?'':`<button class="eye-star" id="eyeTake" aria-label="瞳の白い星を取る">★</button>`}</div>`;shell('🔭 望遠鏡',`${img}<p class="mini">${empty?'セラは望遠鏡を覗いたまま、動かない。': 'セラがこちらを覗き込んだ。瞳の奥で白い星が輝いている。'}</p>${empty&&s.meteorTaken?'<div class="row"><button class="btn" id="restore">流れ星の星を瞳に戻す</button></div>':''}`);if(!empty){let btn=$('eyeTake');btn.onclick=takeEye;btn.addEventListener('pointerdown',e=>{btn.setPointerCapture(e.pointerId);btn.dataset.startY=e.clientY});btn.addEventListener('pointerup',e=>{if(Math.abs(e.clientY-(+btn.dataset.startY))>15)takeEye()})}if(empty&&s.meteorTaken)$('restore').onclick=restore}
function takeEye(){if(s.eye)return;s.eye=true;say('…………');refresh();shell('✦ 白い星を手に入れた',`<p>セラの瞳から、白い星が抜け落ちた。</p><p>セラは望遠鏡を覗いたまま、ぴくりとも動かない。</p><div class="row"><button class="btn" data-close>戻る</button></div>`)}
function restore(){s.restored=true;s.meteor=false;s.meteorTaken=false;refresh();say('……あれ？　星座、できたんだね。\n君と一緒に星座を見たかったんだ。');shell('✦ ふたりの星座',`<p>白い星が瞳に戻ると、セラはゆっくり顔を上げた。</p><p>「……あれ？　星座、できたんだね。」</p><p><strong>「君と一緒に星座を見たかったんだ。」</strong></p><p>窓の外には、ふたりで作った星座が輝いている。</p><div class="row"><button class="btn" id="ending">エンディングを見る ♪</button></div>`);$('ending').onclick=()=>shell('♪ 星座になれたら',`<p>エンディングの歌ってみた動画を開こう。</p><p><a class="btn" style="display:inline-block;color:white;text-decoration:none" href="https://youtu.be/1Kkv-2aYqKk" target="_blank" rel="noopener">YouTubeで再生 ▶</a></p>`)}
function staff(){if(!s.eye)return say('そこはスタッフ専用だよ〜。お客さんはこっち！');s.staff=true;say('…………');shell('🚪 スタッフ室',`<p>ドアが開いた。セラは止めに来ない。</p><div class="paper">机の上にテレビのリモコンが置かれている。</div><div class="row"><button class="btn" id="remote">${s.remote?'リモコンを持っている':'リモコンを取る'}</button></div>`);$('remote').onclick=()=>{s.remote=true;save();shell('📺 リモコンを入手','<p>テレビのチャンネルを変えられそうだ。</p>')}}
function tv(){if(!s.remote)return shell('📺 テレビ','<div class="news"><h3>バラエティ番組</h3><p>今夜のおすすめスイーツ特集！</p></div><p>リモコンが見当たらない。チャンネルは変えられない。</p>');let channels=[['バラエティ番組','今夜のおすすめスイーツ特集！'],['天気予報','今夜は雲が少なく、星空が広がるでしょう。'],['ニュース速報','今夜、流星群が見頃を迎えます。ピークは午前0時ごろ。'],['通販番組','星形のクッション、好評発売中！']];let c=channels[s.channel];shell('📺 テレビ',`<div class="news"><h3>${c[0]}</h3><p>${c[1]}</p></div><div class="row"><button class="btn" id="prev">◀ CH</button><button class="btn" id="next">CH ▶</button></div>`);if(s.channel===2){s.news=true;save()}$('prev').onclick=()=>{s.channel=(s.channel+3)%4;tv()};$('next').onclick=()=>{s.channel=(s.channel+1)%4;tv()}}
function windowLook(){if(s.meteor&&s.eye&&!s.restored){shell('🌠 流れ星',`<div class="sky" style="height:190px;text-align:center;padding-top:40px;font-size:65px;color:#fff8bd;text-shadow:0 0 30px white">☄</div><p>流れ星が夜空を横切った。その光の中に、白い星が見える。</p><div class="row"><button class="btn" id="getMeteor">白い星を取る</button></div>`);$('getMeteor').onclick=()=>{s.meteorTaken=true;s.meteor=false;say('…………');shell('✦ 流れ星の星を手に入れた','<p>白い星が手元に残った。……どこかに戻せるだろうか。</p>');save()};return}sky()}
function bag(){shell('🎒 もちもの',`<p>集めた星：${s.stars} 個<br>瞳から取った星：${s.eye?'1 個':'なし'}<br>テレビのリモコン：${s.remote?'あり':'なし'}<br>流れ星のニュース：${s.news?'見た':'まだ'}<br>流れ星の星：${s.meteorTaken?'あり':'なし'}</p>`)}
function inspect(id){if(id==='sera'){if(s.eye&&!s.restored)return say('…………');return say('星が集まったら、窓から夜空を見てみよう！')}if(id==='books')return books();if(id==='clock')return clock();if(id==='chart')return chart();if(id==='device')return device();if(id==='notes')return notes();if(id==='window')return windowLook();if(id==='telescope')return telescope();if(id==='staff')return staff();if(id==='tv')return tv()}
function near(){let p=s.pos;let sorted=items.map(it=>({it,d:Math.hypot(p.x-(it.x+it.w/2),p.y-(it.y+it.h/2))})).sort((a,b)=>a.d-b.d);return sorted[0].it.id}
function move(dx,dy){s.pos.x=Math.max(20,Math.min(620,s.pos.x+dx));s.pos.y=Math.max(145,Math.min(350,s.pos.y+dy));draw();save()}
canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*400/r.height;let hit=items.find(it=>x>=it.x-10&&x<=it.x+it.w+10&&y>=it.y-10&&y<=it.y+it.h+10);if(hit)inspect(hit.id);else{s.pos={x:Math.max(20,Math.min(620,x)),y:Math.max(145,Math.min(350,y))};draw()}});
$('interact').onclick=()=>inspect(near());$('bag').onclick=bag;$('dev').onclick=()=>{if(!s.eye){say('まずは星を集めてみよう！');return}s.meteor=true;say('…………');save();shell('🛠 DEV：流れ星を出現させた','<p>窓から夜空を見てみよう。流れ星が現れている。</p>')};$('reset').onclick=()=>{if(confirm('進行状況を消して最初から始める？')){localStorage.removeItem('sera-observatory-2026');location.reload()}};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d=b.dataset.move;move(d==='left'?-22:d==='right'?22:0,d==='up'?-22:d==='down'?22:0)});document.addEventListener('keydown',e=>{if(!overlay.hidden)return;let k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault();move(k==='ArrowLeft'?-22:k==='ArrowRight'?22:0,k==='ArrowUp'?-22:k==='ArrowDown'?22:0)}if(k==='Enter'||k===' ')inspect(near())});overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
refresh();if(s.eye&&!s.restored)say('…………');if(s.restored)say('君と一緒に星座を見たかったんだ。');
// midnight appearance while observing, for local device time
setInterval(()=>{if(s.eye&&!s.restored&&s.news){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5)s.meteor=true}},20000);
</script></body></html>
