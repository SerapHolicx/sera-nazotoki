/* Only the badge moves. The button stays anchored to the object. */
.object,.search-point{
  --marker-size:17px;--marker-ink:#fff2be;--marker-rim:#e0c386;--marker-x:0px;--marker-y:-5px;

.object::before,.object::after,.search-point::before,.search-point::after{
  grid-area:1/1;pointer-events:none;transform:translate(var(--marker-x),var(--marker-y));
  animation:marker-hop var(--marker-cycle,2.15s) var(--marker-delay,0s) ease-in-out infinite
}

  content:"";width:var(--marker-size);height:calc(var(--marker-size) + 2px);

  filter:drop-shadow(0 2px 2px #090e25)

  font:bold 10px/1 ui-monospace,monospace
}

  <p id="boardFeedback" aria-live="polite">${st.observationReply&&!st.observationLinked?'窓の向こうから、返事が届いている。':''}</p><button class="btn star-tray" data-star-tray>✦ 保管箱 ${available} 個 ／ 夜空 ${st.placed.length} / 6</button>
  ${resolving?`<div class="gate-resolution"><p>${note}</p><div class="buttons">
   ${numberGate?'<button class="btn primary" id="observeGate">星座を観測する</button>':waitingGate&&st.observationLinked?'<button class="btn primary" id="replayObservation">真エンドをもう一度見る</button>':''}
  </div></div>`:'<p class="muted">保管箱の星を穴へ。タップでも、置いたり戻したりできる。</p>'}
  ${st.meteor&&!st.meteorStar?'<div class="buttons"><button class="btn primary" id="meteorBtn">……流れ星が見える！</button></div>':''}`);
 if($('replayObservation'))$('replayObservation').onclick=showObservationEnding;
 const panel=$('modalBody');
 const tray=panel.querySelector('[data-star-tray]');
 const slots=[...panel.querySelectorAll('[data-position]')];
 const getPosition=target=>target===tray?null:Number(target.dataset.position);
 let tapSuppressed=false;
 let drag=null;
 let ghost=null;
 let target=null;
 function clearDrag(){
  drag=null;ghost?.remove();ghost=null;
  target?.classList.remove('drop-target');target=null;
 }
 function update(next){
  st.placed=next;
  if(!hasPattern(wordSlots)){st.observationPending=null;st.observationLinked=false}
  placeTone();save();
  if(st.secondRun||!hasPattern(numberSlots)){
   sky();
   return;
  }
  closeModal();triggerFlash();chime();
  if(st.restored)say(['……やっと完成したね！','君と一緒に星座を見たかったんだ。'],()=>showEnding());
  else say([{name:'あなた',text:'……星座ができた。'},{name:'あなた',text:'だけど、セラは望遠鏡を覗いたまま動かない。'}]);
  draw();
 }
 for(const button of slots){
  button.onclick=()=>{
   if(tapSuppressed)return;
   const position=getPosition(button);
   if(st.placed.includes(position))update(st.placed.filter(i=>i!==position));
   else if(available)update([...st.placed,position]);
   else clickTone();
  };
 }
 tray.onclick=()=>{
  if(!tapSuppressed&&available)slots.find(button=>!st.placed.includes(getPosition(button)))?.focus({preventScroll:true});
 };
 internalModalCloser=clearDrag;
 for(const button of [tray,...slots.filter(node=>st.placed.includes(getPosition(node)))]){
  button.onpointerdown=event=>{
   if(!event.isPrimary||(button===tray&&!available))return;
   drag={id:event.pointerId,source:getPosition(button),x:event.clientX,y:event.clientY};
   button.setPointerCapture(event.pointerId);
  };
  button.onpointermove=event=>{
   if(drag?.id!==event.pointerId)return;
   if(!ghost){
    if(Math.hypot(event.clientX-drag.x,event.clientY-drag.y)<8)return;
    ghost=document.createElement('span');ghost.className='drag-star';ghost.textContent='✦';
    ghost.setAttribute('aria-hidden','true');document.body.append(ghost);
   }
   ghost.style.left=event.clientX+'px';ghost.style.top=(event.clientY-13)+'px';
   const hit=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-position],[data-star-tray]');
   target?.classList.remove('drop-target');
   target=hit&&panel.contains(hit)?hit:null;
   target?.classList.add('drop-target');
  };
  button.onpointerup=event=>{
   if(drag?.id!==event.pointerId)return;
   const source=drag.source;
   const destination=target?getPosition(target):undefined;
   const moved=Boolean(ghost);
   clearDrag();
   if(!moved)return;
   tapSuppressed=true;setTimeout(()=>{tapSuppressed=false},0);
   if(destination===undefined||destination===source||st.placed.includes(destination)||(source===null&&st.placed.length>=6))return;
   const next=st.placed.filter(position=>position!==source);
   if(destination!==null)next.push(destination);
   update(next);
  };
  button.onpointercancel=clearDrag;
  button.onlostpointercapture=clearDrag;
 }

 if(numberGate&&resolving)$('observeGate').onclick=()=>showEnding('open');

function acceptObservation(){
 const fragment=new URLSearchParams(location.hash.slice(1));
 const version=fragment.get('v');
 const resume=fragment.get('profileGate')==='1';
 if(fragment.get('gate')!=='word'||!['2','3'].includes(version)||(!resume&&!fragment.has('observation')))return null;
 history.replaceState(null,'',location.pathname+location.search);
 if(version==='2'&&resume){resumeObservation();return 'redirect'}
 const receipt=fragment.get('observation');
 if(fragment.get('source')!=='profile'||!/^[a-f0-9]{32}$/.test(receipt??''))return 'invalid';
 if(version==='2'&&receipt!==st.observationPending)return 'invalid';
 if(version==='3'){
  const issued=Number(fragment.get('issued'));
  const age=Date.now()-issued;
  if(!Number.isSafeInteger(issued)||issued<=0||age<0||age>=30*60*1000)return 'invalid';
 }
 if(receipt===st.lastObservationReceipt&&receipt!==st.observationReply)return 'used';
 st.observationReply=receipt;
 st.observationPending=null;
 save();
 return 'received';
}
function showObservationEnding(){
 internalModalCloser=null;
 closeModal();
 stopTitleStars();
 $('titleScreen').hidden=true;
 draw();
 showEnding('true');
}
function finishObservation(){
 if(!st.observationReply||st.observationLinked||!canResolveGate()||!hasPattern(wordSlots))return false;
 st.observationLinked=true;
 st.lastObservationReceipt=st.observationReply;
 st.zone=1;
 showObservationEnding();
 return true;
}
function syncObservation(){
 try{
  const latest=JSON.parse(localStorage.getItem(key)||'null');
  if(latest?.runId!==st.runId||!latest.observationReply||latest.observationReply===st.observationReply)return;
  st.observationReply=latest.observationReply;
  if(finishObservation())return;
  $('tip').textContent='窓の向こうから返事が届いた。';
  if($('boardFeedback'))sky();
 }catch{}
}
function handleObservation(){
 const result=acceptObservation();
 if(!result)return false;
 if(result==='redirect')return true;
 if(finishObservation())return true;
 if(result==='received'&&st.observationLinked&&canResolveGate()&&hasPattern(wordSlots)){
  showObservationEnding();
  return true;
 }
 play();
 const text=result==='received'
  ?'向こうからの返事を受け取った。'
  :result==='used'?'この返事は前の観測で使われたようだ。向こうの窓で、星座を作り直そう。'
  :'返事を読み取れなかった。自己紹介サイトの窓で「受信を見る」を開き、もう一度「返事を届ける」を押そう。';
 say({name:'あなた',text});
 return true;
}
let titleTimer;
function stopTitleStars(){clearInterval(titleTimer)}
function title(){
 stopTitleStars();
 $('titleScreen').hidden=false;
 $('titleStars').innerHTML=st.endingDone?constellationSvg('title-constellation'):'';
 $('titleSubtitle').textContent=st.endingDone?'ふたりで見た星座は、今夜も空に輝いている。':'君と紡ぐ、ひとつの星座。';
 $('startBtn').textContent=canStartSecondRun()?'2周目をはじめる':st.introSeen?'つづきから':'ゲームをはじめる';
 if(!st.endingDone)return;
 const stars=[...$('titleStars').querySelectorAll('[data-star]')];
 let beat=0;
 titleTimer=setInterval(()=>{
  stars.forEach((star,index)=>star.classList.toggle('lit',index===phoneOrder[beat]));
  beat=(beat+1)%(phoneOrder.length+2);
 },800);
}
function canStartSecondRun(){return st.endingDone&&!st.secondRun&&st.restored&&hasPattern(numberSlots)}
function restart(){
 const {endingDone,secondRun,observationReply,lastObservationReceipt}=st;
 st={...defaults(),runId:newObservationId(),endingDone,secondRun:endingDone,lastObservationReceipt,
  observationReply:endingDone&&!secondRun?observationReply:null};selectedItem=null;
 msgQueue=[];onMsgsDone=null;nextMessage();save();play();
}
function play(){stopTitleStars();$('titleScreen').hidden=true;if(!musicOn)musicSwitch(true);draw();if(!st.introSeen){st.introSeen=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日はね、君と一緒に星座を見たいんだ。','ここには、いろんな仕掛けがあるの。遊んだり調べたりすると、小さな星が見つかるよ！','出てきた星は、タップして拾ってね。星は保管箱に入るよ。','集めた星は、窓から見える夜空に置けるんだ。どんな星座になるかな？','……僕、ずっと誰かと一緒に星座を見たかったんだ。今日は楽しみ！'])}};
$('startBtn').onclick=()=>{if(canStartSecondRun())restart();else play()};
$('titleReset').onclick=()=>{if(confirm('この周の進行をリセットして最初から遊ぶ？'))restart()};
$('homeBtn').onclick=()=>{closeModal();title()};
$('resetBtn').onclick=$('titleReset').onclick;
$('devBtn').onclick=()=>{if(!st.eyeTaken){say({name:'システム',text:'流れ星のテストはセラの瞳から星を取った後に使える。'});return}st.news=true;st.meteor=true;save();say({name:'システム',text:'流れ星が現れた。窓の空を見よう。'})};
let endPhase=0;
const endingLines={
 first:['……セラの瞳が、ふたたび光りだす。','セラは望遠鏡から顔を上げ、あなたを見つめた。','……わあ。きれい。','君と一緒に星座を見たかったんだ。','✧ ふたりの星座 ✧'],
 open:['六つの星がつながった。窓の外で、何かがまばたきをした。','「……見つけてくれたの？」','誰も答えていない。けれどセラは、窓の前でそっと耳を澄ませた。','接続エンド ― 向こうからの視線'],
 true:['六つの星が静かに瞬く。窓の向こうから、あたたかな光が返った。','「……君が、見つけてくれたんだね。」','真エンド ― 君が見つけた星座']
};
function showEnding(route='first'){
 $('endingScreen').dataset.route=route;
 $('endNext').disabled=false;
 $('endTitle').textContent='タイトルへ';
 st.endingDone=true;
 save();closeModal();musicSwitch(false);endPhase=0;
 $('endingScreen').hidden=false;
 const figure=constellationSvg('',route==='true'?wordSlots:numberSlots).replace(/^<svg[^>]*>|<\/svg>$/g,'');
 $('endConst').innerHTML=figure+(route==='first'?'<circle id="endOmen" class="first-omen" cx="47" cy="49" r="1.4" fill="#fff4c9"/>'
   :route==='open'?'<image id="endOmen" href="end-omen.png" x="35" y="42" width="24" height="15"/>':'');
 $('endMusic').hidden=true;
 $('endText').textContent=endingLines[route][endPhase];
 $('songInfo').textContent='';
}
$('endNext').onclick=()=>{
 const route=$('endingScreen').dataset.route;
 const lines=endingLines[route];
 endPhase=Math.min(lines.length-1,endPhase+1);
 $('endText').textContent=lines[endPhase];
 if(route==='first'||route==='true')chime();
 if(route==='first'&&endPhase>=3){
  $('endMusic').hidden=false;
  $('songInfo').textContent='歌声と星空を一緒に楽しめるよ。';
 }
 if(endPhase===lines.length-1){
  $('endOmen')?.classList.add('reveal-omen');
  $('endNext').disabled=true;$('endTitle').textContent='星座のあるタイトルへ';
 }
};
$('endTitle').onclick=()=>{$('song').pause();$('endingScreen').hidden=true;title()};$('endMusic').onclick=async()=>{let audio=$('song');try{await audio.play();$('songInfo').textContent='♪ 星座になれたら';$('endMusic').textContent='♪ 再生中'}catch(e){$('songInfo').textContent='歌唱音源は未収録です。ending_song.mp3 を同じフォルダに置くと、ここで流れます。';tone(784,.5,.04);tone(1047,.6,.03,.12)}};$('song').onended=()=>{$('endMusic').textContent='♪ もう一度聴く'};
window.addEventListener('storage',event=>{if(event.key===key)syncObservation()});
window.addEventListener('pageshow',syncObservation);
window.addEventListener('focus',syncObservation);
window.addEventListener('hashchange',handleObservation);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncObservation()});
if(!handleObservation()){
 draw();title();
 finishObservation();
}
})();
</script></body></html>
