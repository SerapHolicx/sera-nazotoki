function collect(id){if(st.got.includes(id))return;const label={'books':'本棚','lamp':'ランプ','desk':'観測机','orb':'天球儀','shadow':'壁のランプ'}[id];openModal(label,`<div id="pickup" style="min-height:190px;text-align:center"><p>白い星が現れた。</p><button class="click-star" id="pick" aria-label="星を拾う">✦</button><p class="muted">星に触れて拾おう。</p></div>`);$('pick').onclick=()=>{const box=$('pickup');box.innerHTML='<div class="empty-star">……星の光が消えた。</div><p style="text-align:center">星をひとつ拾った。</p>';chime();st.got.push(id);save();draw();setTimeout(()=>{closeModal();if(st.got.length===5)say('五つそろったね。最後のひとつ……まだ、どこかで光ってるのかな。');else say('やったね！ また星がひとつ増えたよ！')},650)}}

function books(){if(st.got.includes('books'))return already();const titles=['真昼の観測','夜の帳','夜明けの記録','夕焼けの空'];const order=[2,0,3,1];function view(){openModal('本棚',`<p>4冊の観測日誌。ページを読むと、それぞれ違う時間の出来事が書かれている。</p><div class="book-list" id="books">${titles.map((x,i)=>`<button data-book="${i}"><b>${x}</b><br>${['太陽がいちばん高くのぼる。','空に星が現れ始める。','空の端が白み始める。','空が茜色に染まる。'][i]}</button>`).join('')}</div><p>一日の流れになるよう、順番に本を選ぼう。</p><p class="muted">選んだ順番：<span id="picked">${st.bookProgress.map(i=>titles[i]).join(' → ')||'まだない'}</span></p><div class="buttons"><button class="btn" id="booksReset">やり直す</button></div>`);$('booksReset').onclick=()=>{st.bookProgress=[];view()};document.querySelectorAll('[data-book]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.book);if(st.bookProgress.includes(i))return;st.bookProgress.push(i);clickTone();if(st.bookProgress.length===4){if(st.bookProgress.every((v,n)=>v===order[n])){chime();openModal('本棚',`<div class="paper"><p>本が正しい順番に並んだ。背表紙には、6つの光がつながる模様が隠れていた。</p>${constellationSvg('mini-const')}</div><div class="buttons"><button class="btn primary" id="reward">引き出しを開ける</button></div>`);$('reward').onclick=()=>collect('books')}else{st.bookProgress=[];view();say({name:'あなた',text:'まだ順番が違うようだ。'})}}else view()})}view()}
function lamp(){if(st.got.includes('lamp'))return already();let n=0,dark=false;function view(){openModal('ランプ',`<div class="stage" style="filter:${dark?'brightness(.5)':'none'}"><button class="star-escape" id="runner" style="left:${[43,76,21,67][n%4]}%;top:${[47,32,70,64][n%4]}%" aria-label="逃げる星">✦</button></div><p>${dark?'明かりを消すと、星が静かに近づいてきた。':'ランプのまわりに小さな星がいる。でも触ろうとすると……？'}</p><div class="buttons"><button class="btn" id="lampToggle">${dark?'ランプをつける':'ランプを消す'}</button></div>`);$('runner').onclick=()=>{if(dark)collect('lamp');else{n++;clickTone();view()}};$('lampToggle').onclick=()=>{dark=!dark;clickTone();view()}}view()}
function desk(){if(st.got.includes('desk'))return already();let step=st.seedStep||0;function view(){openModal('観測机',`<div class="paper"><b>星の種を育てる小さな実験</b><p>机に小さな瓶、星の種、透明なふたがある。窓の外には月明かり。</p></div><div style="font-size:65px;text-align:center;margin:18px 0">${['◇','✧','✦'][Math.min(step,2)]}</div><p>${['まず、種を瓶に入れてみよう。','瓶を月明かりの差す窓際に置こう。','瓶の中に、白い星が生まれた！'][Math.min(step,2)]}</p><div class="buttons"><button class="btn primary" id="seedAction">${['種を瓶に入れる','窓際に置く','星を取り出す'][Math.min(step,2)]}</button></div>`);$('seedAction').onclick=()=>{if(step>=2)collect('desk');else{step++;st.seedStep=step;clickTone();save();view()}}}view()}
function orb(){if(st.got.includes('orb'))return already();let n=st.polish||0;function view(){openModal('天球儀',`<div class="stage" style="display:grid;place-items:center"><button id="polish" style="width:150px;height:150px;border-radius:50%;border:7px solid #c5b58c;background:radial-gradient(circle,#7779b7,#2c326b);color:#fff;font-size:75px;filter:brightness(${.5+n*.075})" aria-label="球体をこする">${n>=7?'✦':'◌'}</button></div><p>表面がくすんだ天球儀。指で何度かこすってみよう。</p><div class="progress-bar"><span style="width:${Math.min(100,n*14)}%"></span></div>`);let btn=$('polish'),last=null;btn.onpointermove=e=>{if(e.buttons&&last!==null&&Math.abs(e.clientX-last)>5){last=e.clientX;n=Math.min(7,n+1);st.polish=n;save();if(n===7)collect('orb');else view()}};btn.onpointerdown=e=>{last=e.clientX};btn.onclick=()=>{n=Math.min(7,n+1);st.polish=n;placeTone();save();if(n>=7)collect('orb');else view()}}view()}
function shadow(){if(st.got.includes('shadow'))return already();let n=st.shadowStep||0;function view(){openModal('壁のランプ',`<div class="stage" style="display:grid;place-items:center"><div style="font-size:75px;filter:drop-shadow(${n===2?'0 0 12px #fff':'0 0 3px #777'})">${n===2?'✦':'◈'}</div></div><p>${['壁の飾りが、少し変わった影を落としている。','ランプの向きを変えると、星形の影ができた。','影の中心に、星の光が現れた！'][n]}</p><div class="buttons"><button class="btn primary" id="shadowAction">${['ランプを回す','影に触れる','星を拾う'][n]}</button></div>`);$('shadowAction').onclick=()=>{if(n===2)collect('shadow');else{n++;st.shadowStep=n;clickTone();save();view()}}}view()}
function startNpcMove(){if(st.npcMoving||st.npcAtScope)return;closeModal();st.npcMoving=true;st.zone=1;draw();say('わかった。ちょっと、覗いてみるね。');requestAnimationFrame(()=>{const npc=$('npc');npc.style.left='71%';npc.style.top='57%'});setTimeout(()=>{if(!st.npcMoving)return;st.npcMoving=false;st.npcAtScope=true;draw()},3200)}
function examineSera(){if(!st.eyeTaken){
 if(st.npcAtScope){say({name:'あなた',text:'セラは望遠鏡を覗き込んでいる。'});return}

}if(st.restored){say('……星座、きれいだったね。ありがとう！');return}if(st.keyFound){openModal('セラ',`<img src="sera_sleep.png" style="width:155px;display:block;margin:auto;image-rendering:pixelated" alt="動かないセラ"><p>セラは望遠鏡を覗いたまま、動かない。呼びかけても返事がない。</p>`);return}openModal('セラ',`<img src="sera_sleep.png" style="width:155px;display:block;margin:auto;image-rendering:pixelated" alt="光を失ったセラ"><p>セラは望遠鏡を覗いたまま、動かない。</p><p>……服のポケットから、何かが少し覗いている。</p><div class="buttons"><button class="btn" id="lookHat">帽子を調べる</button><button class="btn primary" id="lookPocket">ポケットを調べる</button></div><p id="found"></p>`);$('lookHat').onclick=()=>$('found').textContent='羽の飾りは、いつもと変わらない。';$('lookPocket').onclick=()=>{st.keyFound=true;chime();save();$('found').textContent='小さな真鍮の鍵が見つかった。「スタッフ室」と刻まれている。';$('lookPocket').disabled=true}}
function seraEye({label, lit=false, id='', focus='', interactive=false}){
 return `<div class="scope eye-view ${focus}" ${id?'id="'+id+'"':''}><img src="eye_empty.png" alt="${label}">${lit?'<span class="eye-star" aria-hidden="true"></span>':''}${interactive?'<button class="eye-hot" id="eyeHot" aria-label="白い光に触れる"></button>':''}</div>`;
}
function scope(){
 if(!st.npcAtScope||st.restored){
  st.mirrorSeen=true;save();
  openModal('望遠鏡',`<div class="scope"><img src="player_eye.png" alt="望遠鏡のレンズに映った自分の瞳"></div><p>……レンズを覗くと、自分の瞳が映り込んだ。</p>`);
  return;
 }
 if(st.meteorStar){restoreScope();return}
 if(st.eyeTaken){
  openModal('望遠鏡',seraEye({label:'星を失った瞳'})+'<p>セラの瞳から、白い光が消えている。</p>');
  return;
 }
 const f=st.scopeFocus;
 if(f<2){
  openModal('望遠鏡',seraEye({label:'望遠鏡に映るぼんやりした像',lit:true,focus:f===0?'blurry':'lessblurry'})
   +`<p>${f===0?'像がぼやけて、何が見えているか分からない。':'……誰かの瞳のように見える。'}</p><div class="buttons"><button class="btn primary" id="focus">ピントを合わせる</button></div>`);
  $('focus').onclick=()=>{st.scopeFocus++;clickTone();save();scope()};
  return;
 }
 openModal('望遠鏡',seraEye({label:'望遠鏡に映るセラの瞳。白い星がある。',lit:true,id:'scopeArea',interactive:true})
  +'<p id="eyeHint">……セラの瞳の中で、白い星が静かに揺れている。</p>');
 const btn=$('eyeHot');
 let press=null;
 btn.onpointerdown=e=>{
  press={x:e.clientX,y:e.clientY};
  btn.setPointerCapture(e.pointerId);
 };
 btn.onpointercancel=()=>{press=null};
 btn.onpointerup=e=>{
  if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>22)takeEye();
  press=null;
 };
 btn.onclick=()=>{
  if(st.eyeNotice>=1){takeEye();return}
  st.eyeNotice=1;save();$('eyeHint').textContent='……いま、白い星が少し動いた？';
  $('scopeArea').classList.add('ripple');placeTone();
 };
}
function animateEyeStar(view, className, finish){
 const star=view.querySelector('.eye-star')||document.createElement('span');
 star.className=className;
 star.setAttribute('aria-hidden','true');
 view.appendChild(star);
 star.addEventListener('animationend',()=>{if(star.isConnected)finish()},{once:true});
}
function takeEye(){
 const btn=$('eyeHot');
 if(btn.disabled)return;
 btn.disabled=true;
 placeTone();
 animateEyeStar($('scopeArea'),'fly-star',()=>{
  st.eyeTaken=true;save();draw();chime();scope();
 });
}

function television(usedNow=false){const channels=[['バラエティ','星の形のクッキーを作っています！'],['天気予報','夜空は晴れ。観測日和です。'],['天文ニュース','今夜、流星群が午前0時ごろに見頃を迎えます。'],['通販番組','天体観測用のクッションをご紹介！']];const c=channels[st.remoteUsed?st.channel:0];if(st.remoteUsed&&st.channel===2){st.news=true;save()}openModal('テレビ',`<div class="television"><div class="broadcast">${st.remoteUsed&&st.channel===2?'<div class="tv-meteor">✦</div>':'✧　✦　✧'}</div><div class="crawl">YOIZORA TV ｜ ${c[0]}</div></div><p><strong>${c[0]}</strong>：${c[1]}</p>${usedNow?'<p>ピッ。チャンネルを切り替えられそうだ。</p>':''}${st.remoteUsed?'<div class="buttons"><button class="btn" id="prevTV" aria-label="前のチャンネル">◀</button><button class="btn" id="nextTV" aria-label="次のチャンネル">▶</button></div>':st.remote?'<div class="buttons"><button class="btn primary" id="useRemote">リモコンを使う</button></div>':'<p>リモコンが見つからず、チャンネルを変えられない。</p>'}`);if($('useRemote'))$('useRemote').onclick=()=>{st.remoteUsed=true;save();clickTone();television(true)};if(st.remoteUsed){$('prevTV').onclick=()=>{st.channel=(st.channel+3)%4;clickTone();television()};$('nextTV').onclick=()=>{st.channel=(st.channel+1)%4;clickTone();television()}}}

function sky(){if(st.eyeTaken&&!st.restored&&st.news&&!st.meteorStar){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5){st.meteor=true;save()}}const available=total()-st.placed.length;const full=st.placed.length===6;openModal('窓の向こうの夜空',`<p>集めた星を、夜空に並べよう。${st.got.includes('books')?'本棚で見た背表紙の形を思い出して。':''}</p><div class="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${links.map(i=>targets[i].join(',')).join(' ')}" fill="none" stroke="#fff1ca" opacity="${full?'.9':'.08'}" stroke-width=".6"/></svg>${targets.map(([x,y],i)=>`<button class="slot ${st.placed.includes(i)?'filled':''}" data-position="${i}" style="left:${x}%;top:${y}%" aria-label="${i+1}番の星の位置">${st.placed.includes(i)?'✦':'·'}</button>`).join('')}</div><p style="text-align:center">保管箱 ${available} 個 ／ 夜空 ${st.placed.length} / 6</p><p class="muted">場所をタップすると星を置ける。置いた星をタップすると戻せる。</p>${st.meteor&&!st.meteorStar?'<div class="buttons"><button class="btn primary" id="meteorBtn">……流れ星が見える！</button></div>':''}`);
document.querySelectorAll('[data-position]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.position);if(st.placed.includes(i))st.placed=st.placed.filter(x=>x!==i);else if(st.placed.length<total())st.placed.push(i);else{clickTone();return}placeTone();save();if(st.placed.length===6){closeModal();triggerFlash();chime();if(st.restored){say(['……やっと完成したね！','君と一緒に星座を見たかったんだ。'],showEnding)}else{say([{name:'あなた',text:'……星座ができた。'}, {name:'あなた',text:'だけど、セラは望遠鏡を覗いたまま動かない。'}])}draw()}else sky()});if($('meteorBtn'))$('meteorBtn').onclick=meteorTake}

function title(){ $('titleScreen').hidden=false;$('titleStars').innerHTML=st.endingDone?constellationSvg('title-constellation'):'';$('titleSubtitle').textContent=st.endingDone?'ふたりで見た星座は、今夜も空に輝いている。':'君と紡ぐ、ひとつの星座。';$('startBtn').textContent=st.endingDone?'もう一度、天文台へ':'ゲームをはじめる'}
$('startBtn').onclick=()=>{$('titleScreen').hidden=true;if(!musicOn)musicSwitch(true);draw();if(!st.introSeen){st.introSeen=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日はね、君と一緒に星座を見たいんだ。','ここには、いろんな仕掛けがあるの。遊んだり調べたりすると、小さな星が見つかるよ！','出てきた星は、タップして拾ってね。星は保管箱に入るよ。','集めた星は、窓から見える夜空に置けるんだ。どんな星座になるかな？','……私、ずっと誰かと一緒に星座を見たかったんだ。今日は楽しみ！'])}};
$('titleReset').onclick=()=>{if(confirm('進行状況を消して最初から遊ぶ？')){st=defaults();save();$('titleScreen').hidden=true;draw();st.introSeen=true;save();say(['こんせら〜！ 宵空天文台へようこそ！','今日は君と一緒に星座を見たいんだ。仕掛けを調べて星を集めてね！'])}};$('homeBtn').onclick=()=>{closeModal();title()};$('resetBtn').onclick=()=>{if(confirm('セーブを消して最初から遊ぶ？')){st=defaults();save();draw();title()}};
$('devBtn').onclick=()=>{if(!st.eyeTaken){say({name:'システム',text:'流れ星のテストはセラの瞳から星を取った後に使える。'});return}st.news=true;st.meteor=true;save();say({name:'システム',text:'流れ星が現れた。窓の空を見よう。'})};
let endPhase=0;const endLines=['……セラの瞳が、ふたたび光りだす。','セラは望遠鏡から顔を上げ、あなたを見つめた。','……わあ。きれい。','君と一緒に星座を見たかったんだ。','✧ ふたりの星座 ✧'];
function showEnding(){$('endNext').disabled=false;$('endTitle').textContent='タイトルへ';st.endingDone=true;save();closeModal();musicSwitch(false);endPhase=0;$('endingScreen').hidden=false;$('endConst').innerHTML=constellationSvg('').replace(/^<svg[^>]*>|<\/svg>$/g,'');$('endMusic').hidden=true;$('endText').textContent=endLines[0];$('songInfo').textContent=''}
$('endNext').onclick=()=>{endPhase=Math.min(endLines.length-1,endPhase+1);$('endText').textContent=endLines[endPhase];chime();if(endPhase>=3){$('endMusic').hidden=false;$('songInfo').textContent='歌声と星空を一緒に楽しめるよ。'}if(endPhase===endLines.length-1){$('endNext').disabled=true;$('endTitle').textContent='星座のあるタイトルへ'}};
$('endTitle').onclick=()=>{$('song').pause();$('endingScreen').hidden=true;title()};$('endMusic').onclick=async()=>{let audio=$('song');try{await audio.play();$('songInfo').textContent='♪ 星座になれたら';$('endMusic').textContent='♪ 再生中'}catch(e){$('songInfo').textContent='歌唱音源は未収録です。ending_song.mp3 を同じフォルダに置くと、ここで流れます。';tone(784,.5,.04);tone(1047,.6,.03,.12)}};$('song').onended=()=>{$('endMusic').textContent='♪ もう一度聴く'};
setInterval(()=>{if(st.eyeTaken&&st.news&&!st.restored&&!st.meteorStar){let d=new Date();if(d.getHours()===0&&d.getMinutes()<5)st.meteor=true}},20000);
if(st.npcMoving){st.npcAtScope=true;st.npcMoving=false}draw();title();
})();
</script></body></html>
