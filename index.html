</style></head><body><div id="app"><header class="head"><div><small>THE YOIZORA OBSERVATORY</small><h1>✦ 宵空天文台 ✦</h1></div><button id="home" class="chip">タイトル</button><button id="sound" class="chip">♪ OFF</button><button id="reset" class="chip">はじめから</button></header><div class="frame"><div class="mapwrap" id="map"><canvas id="canvas" width="640" height="400" aria-label="天文台のドット絵マップ"></canvas></div><div class="hud"><div class="stars" id="stars">☆☆☆☆☆☆</div><div class="actions"><button class="btn" id="bag">もちもの</button><button class="btn" id="dev">DEV 🌠</button></div></div></div><div class="dialog"><div class="portrait"><img id="portraitArt" src="sera_portrait.png" alt="宵空セラ"><span class="shine" id="portraitStar" hidden>✦</span></div><div><strong id="speaker">セラ</strong><p id="line">こんせら〜！ ようこそ、宵空天文台へ！ 星を集めて、ひとつの星座をつくろうね！</p></div></div><p class="hint">光る印をタップして探索。星を見つけたら、タップして拾おう。</p></div><section id="titleScreen" class="title-screen" hidden><div class="title-bg"></div><div class="title-content"><div class="tiny">THE YOIZORA OBSERVATORY</div><h1>宵空天文台</h1><p id="titleStatus">君と紡ぐ、ひとつの星座</p><div class="title-constellation" aria-hidden="true"><svg viewBox="0 0 100 100"><polyline points="22,72 39,40 62,26 80,50 70,77 44,80" fill="none" stroke="#ffe7a8" stroke-width="1.5"/></svg></div><button class="btn" id="titleStart">ゲームをはじめる</button><p class="tiny">星を集めて、夜空に並べよう</p></div></section><section id="endingScreen" class="ending-screen" hidden><div class="ending-inner"><div class="ending-stars">✦　✧　✦</div><h2></h2><p></p><button class="btn" id="endNext">つづき ▶</button></div></section><div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),panel=$('panel');
const items=[{id:'books',name:'本棚',x:70,y:87,w:146,h:150},{id:'clock',name:'時計',x:186,y:73,w:46,h:50},{id:'chart',name:'星図',x:468,y:282,w:67,h:73},{id:'device',name:'天球儀',x:456,y:125,w:90,h:92},{id:'notes',name:'観測ノート',x:246,y:201,w:186,h:58},{id:'window',name:'窓',x:259,y:17,w:194,h:115},{id:'telescope',name:'望遠鏡',x:324,y:117,w:125,h:92},{id:'tv',name:'テレビ',x:50,y:268,w:122,h:100},{id:'staff',name:'スタッフ室',x:536,y:88,w:94,h:135},{id:'sera',name:'セラ',x:269,y:253,w:52,h:60}];
let s={done:{},stars:0,eye:false,placed:[],remote:false,channel:0,news:false,meteor:false,meteorTaken:false,restored:false,staff:false,pos:{x:185,y:310},bookOrder:[],bookPick:-1,pending:null,focus:0,walked:false};

const save=()=>localStorage.setItem('sera-observatory-2026-v6',JSON.stringify(s));

function draw(){
 ctx.imageSmoothingEnabled=false;ctx.fillStyle='#191d3b';ctx.fillRect(0,0,640,400);

 const pulse=.65+.28*Math.sin(Date.now()/390);
 for(const [id,x,y] of marks){let entry=items.find(i=>i.id===id);if(!entry)continue;ctx.save();ctx.globalAlpha=pulse;ctx.shadowBlur=14;ctx.shadowColor='#ffdd91';ctx.fillStyle='#fff7cb';ctx.translate(x,y-12);ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(3,-2);ctx.lineTo(8,0);ctx.lineTo(3,2);ctx.lineTo(0,8);ctx.lineTo(-3,2);ctx.lineTo(-8,0);ctx.lineTo(-3,-2);ctx.fill();ctx.restore()}

const nodes=[[22,72],[39,40],[62,26],[80,50],[70,77],[44,80]];
function sky(){let n=s.stars+(s.eye?1:0);let remain=Math.max(0,n-s.placed.length);let html=`<p>星を保管箱から夜空へ。好きなときに配置できるよ。</p><div class="sky" id="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${nodes.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e9d5ac" stroke-width=".5" opacity="${s.placed.length===6?1:.0}"/></svg>${nodes.map((p,i)=>`<button class="node ${s.placed.includes(i)?'filled':''}" style="left:${p[0]}%;top:${p[1]}%" data-node="${i}" aria-label="星の場所${i+1}">${s.placed.includes(i)?'✦':'·'}</button>`).join('')}</div><p class="inventory">保管箱　${remain} 個　｜　夜空　${s.placed.length}/6</p><div id="tray">${Array.from({length:remain},(_,i)=>`<button class="traystar" data-tray="${i}" aria-label="星を選ぶ">✦</button>`).join('')||'<span class="mini">保管箱は空っぽ</span>'}</div><p class="mini">保管箱の星を選んで、夜空の場所をタップ。ドラッグして置くこともできる。置いた星はタップで戻せるよ。</p><div class="row"><button class="btn" id="skyreset">全部戻す</button><button class="btn" data-close>部屋へ戻る</button></div>`;
shell('🌌 星座をつくる',html);
let selected=remain>0;
const place=i=>{if(s.placed.includes(i)){s.placed=s.placed.filter(x=>x!==i)}else if(s.placed.length<n){s.placed.push(i);playPlace()}else return;save();if(s.placed.length===6){s.staff=true;say('…………');shell('✦ 夜空',`<p>6つの光が、ひとつにつながった。</p><p>……天文台は静かなままだ。</p><button class="btn" data-close>部屋へ戻る</button>`);return}sky()};

function telescope(){

 shell('望遠鏡',`<div class="lens focus-view focus-${s.focus}"><img src="eye_lit.png" alt="ぼやけた望遠鏡の像"><div class="lens-haze"></div></div><p>${caption}</p><button class="btn" id="focusBtn">ピントを合わせる　◉</button>`);
 $('focusBtn').onclick=()=>{s.focus++;playPlace();save();telescope()};return}
 shell('望遠鏡',`<div class="lens lens-ready"><img src="eye_lit.png" alt="望遠鏡越しに見えるセラの瞳"><button class="eye-star" id="eyeTake" aria-label="瞳の光に触れる">✦</button></div><p>静かな瞳の奥で、小さな白い光だけが揺れている。</p><p class="mini">……。</p>`);
 const btn=$('eyeTake');let downY=null;

}
function takeEye(){if(s.eye)return;const lens=panel.querySelector('.lens');const star=$('eyeTake');if(star){star.disabled=true;star.classList.add('eye-extract')}playChime();setTimeout(()=>{s.eye=true;say('…………');refresh();shell('🔭 望遠鏡',`<div class="lens empty"><img src="eye_empty.png" alt="光を失った瞳"></div><p>…………</p><button class="btn" data-close>戻る</button>`);},650)}

function staff(){if(!s.eye)return say('そこはスタッフ専用だよ〜。お客さんはこっち！');s.staff=true;say('…………');
shell('スタッフ室',`<div class="staffscene" id="staffscene"><img src="staff_art.png" alt="スタッフ室のドット絵"><button class="spot" style="left:17%;top:44%" data-staff="shelf">✧</button><button class="spot" style="left:52%;top:53%" data-staff="desk">✧</button><button class="spot" style="left:85%;top:40%" data-staff="cabinet">✧</button></div><p id="staffmsg">静かなスタッフ室。机と本棚、戸棚を調べられそう。</p><div class="row"><button class="btn" data-close>天文台へ戻る</button></div>`);

canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*400/r.height;let hit=items.filter(it=>x>=it.x-9&&x<=it.x+it.w+9&&y>=it.y-9&&y<=it.y+it.h+9).sort((a,b)=>(a.w*a.h)-(b.w*b.h))[0];if(hit)inspect(hit.id)});

let audioCtx=null,musicTimer=null,musicOn=false,musicStep=0;
function tone(f,d=.24,v=.025){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.01)}
function playChime(){try{const ac=audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());ac.resume();const now=ac.currentTime;[880,1174.66,1567.98,2093].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;let t=now+i*.095;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.12)})}catch(e){}}
function playPlace(){try{let ac=audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());ac.resume();let t=ac.currentTime;[783.99,1046.5].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.075);g.gain.exponentialRampToValueAtTime(.045,t+i*.075+.014);g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+.34);o.connect(g).connect(ac.destination);o.start(t+i*.075);o.stop(t+i*.075+.36)})}catch(e){}}
function startMusic(){if(musicOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicOn=true;musicTimer=setInterval(()=>{const melody=s.eye&&!s.restored?[392,0,349,0,330,0,294,0]:[523,659,784,659,587,659,523,392];let f=melody[musicStep++%melody.length];if(f)tone(f,.45,.018)},420);$('sound').textContent='♪ ON'}catch(e){}}

$('sound').onclick=toggleMusic;

 };
