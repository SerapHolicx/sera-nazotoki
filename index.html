 number:[[0,1,2,4,5],[1,3,4]],

function constellationPath(gate,points){
 return constellationLinks[gate].map(indices=>
  indices.map((index,i)=>`${i===0?'M':'L'}${points[index].join(',')}`).join(' ')
 ).join(' ');
}
function constellationEye(points,width,height,attributes){
 const [left,top,lower,right]=points.slice(1,5);
 const x=(left[0]+top[0]+lower[0]+right[0])/4-width/2;
 const y=(left[1]+top[1]+lower[1]+right[1])/4-height/2;
 return `<image ${attributes} href="end-omen.png" x="${x}" y="${y}" width="${width}" height="${height}"/>`;
}
function endingConstellation(route){

 const points=patterns[gate].map(slot=>displayHoles[slot]).map(([x,y])=>[x*.86+7,y*.78+5]);
 const stars=points.map(([x,y],i)=>`<circle data-star="${i}" cx="${x}" cy="${y}" r="3" fill="#fff5d5"/>`).join('');
 if(route==='open')return stars+constellationEye(points,40,24,'id="endOmen"');
 if(route==='first')return stars+constellationEye(points,13,7,'id="endOmen" class="first-omen"');
 return stars;
}

 openModal('額入りの星座盤',`

   }).join('')}
  </div></div>
  <p class="operation-note">集めた星をここに置こう。穴をタップすると星を置ける。置いた星は、もう一度タップするとはずせる。</p><p id="boardFeedback" aria-live="polite">${note}</p><button class="btn star-tray" data-star-tray>✦ 保管箱 ${available} 個 ／ 星座盤 ${st.placed.length} / ${starCount}</button>
  ${normalEndingReady?'<div class="buttons"><button class="btn primary" id="watchConstellation">セラと星座を見る</button></div>':''}`);
 if(normalEndingReady)$('watchConstellation').onclick=()=>beginEnding('first');
 drawWindowSky($('boardSkyArt'),true,false);
 window.observatoryStars.paint($('modalBody'));
 const panel=$('modalBody');
 const tray=panel.querySelector('[data-star-tray]');
 const slots=[...panel.querySelectorAll('[data-position]')];
 const getPosition=target=>target===tray?null:Number(target.dataset.position);
 let tapSuppressed=false;
 let drag=null;
 let ghost=null;
 let target=null;
 function clearDrag(){
  drag=null;ghost?.remove();ghost=null;
  target?.classList.remove('drop-target');target=null;
 }
 function update(next){
  st.placed=next;
  placeTone();save();constellationBoard();
 }
 for(const button of slots){
  button.onclick=()=>{
   if(tapSuppressed)return;
   const position=getPosition(button);
   if(st.placed.includes(position))update(st.placed.filter(i=>i!==position));
   else if(available)update([...st.placed,position]);
   else clickTone();
  };
 }
 tray.onclick=()=>{
  if(!tapSuppressed&&available)slots.find(button=>!st.placed.includes(getPosition(button)))?.focus({preventScroll:true});
 };
 internalModalCloser=clearDrag;
 for(const button of [tray,...slots.filter(node=>st.placed.includes(getPosition(node)))]){
  button.onpointerdown=event=>{
   if(!event.isPrimary||(button===tray&&!available))return;
   drag={id:event.pointerId,source:getPosition(button),x:event.clientX,y:event.clientY};
   button.setPointerCapture(event.pointerId);
  };
  button.onpointermove=event=>{
   if(drag?.id!==event.pointerId)return;
   if(!ghost){
    if(Math.hypot(event.clientX-drag.x,event.clientY-drag.y)<8)return;
    ghost=document.createElement('span');ghost.className='drag-star board-star-drag';ghost.innerHTML=window.observatoryStars.markup();window.observatoryStars.paint(ghost);
    ghost.setAttribute('aria-hidden','true');document.body.append(ghost);
   }
   ghost.style.left=event.clientX+'px';ghost.style.top=(event.clientY-13)+'px';
   const hit=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-position],[data-star-tray]');
   target?.classList.remove('drop-target');
   target=hit&&panel.contains(hit)?hit:null;
   target?.classList.add('drop-target');
  };
  button.onpointerup=event=>{
   if(drag?.id!==event.pointerId)return;
   const source=drag.source;
   const destination=target?getPosition(target):undefined;
   const moved=Boolean(ghost);
   clearDrag();
   if(!moved)return;
   tapSuppressed=true;setTimeout(()=>{tapSuppressed=false},0);
   if(destination===undefined||destination===source||st.placed.includes(destination)||(source===null&&st.placed.length>=starCount))return;
   const next=st.placed.filter(position=>position!==source);
   if(destination!==null)next.push(destination);
   update(next);
  };
  button.onpointercancel=clearDrag;
  button.onlostpointercapture=clearDrag;
 }
}

 window.observatoryStars.paint(board);
 const stars=[...board.querySelectorAll('[data-phone-star]')];
 let selected=[];
 const clear=()=>{
  selected=[];
  stars.forEach(btn=>btn.setAttribute('aria-pressed','false'));
 };
 stars.forEach((button,index)=>{button.onclick=()=>{
  if(selected.includes(index))return;
  selected.push(index);
  button.setAttribute('aria-pressed','true');
  placeTone();
  if(selected.length!==phoneOrder.length)return;
  if(canUnlock&&selected.every((star,i)=>star===phoneOrder[i])){unlockPhoneView();return}
  clear();
  if(!canUnlock)showThoughts('今は関係なさそうだ');
 }});
 $('clearPhone').onclick=clear;
 if(!canUnlock)showThoughts('今は関係なさそうだ');
}
function acceptObservation(){
 const fragment=new URLSearchParams(location.hash.slice(1));
 if(!fragment.has('observation')&&!fragment.has('profileGate'))return null;
 history.replaceState(null,'',location.pathname+location.search);
 const receipt=fragment.get('observation');
 const issued=Number(fragment.get('issued'));
 const age=Date.now()-issued;
 if(fragment.get('v')!=='4'||fragment.get('gate')!=='word'||fragment.get('source')!=='profile'
  ||!/^[a-f0-9]{32}$/.test(receipt??'')||!Number.isSafeInteger(issued)||issued<=0||age<0||age>=30*60*1000)return 'invalid';
 if(receipt===st.lastObservationReceipt)return 'used';
 st.observationReply=receipt;
 save();
 return 'received';
}
function syncObservation(){
 try{
  const latest=JSON.parse(localStorage.getItem(key)||'null');
  if(latest?.runId!==st.runId||latest.observationVersion!==4||!latest.observationReply||latest.observationReply===st.observationReply)return;
  st.observationReply=latest.observationReply;
  $('tip').textContent='窓の向こうから返事が届いた。';
  if($('boardFeedback'))constellationBoard();
 }catch{}
}
function handleObservation(){
 const result=acceptObservation();
 if(!result)return false;
 if(!st.runEnding)play();
 const text=result==='received'?'向こうから返事が届いた。':result==='used'?'この返事は、前の観測で受け取ったものだ。':'自己紹介ページの窓で、もう一度接続を確認しよう。';
 if(st.runEnding)$('titleSubtitle').textContent=text;
 else if(st.introSeen&&!$('dialog').hidden)msgQueue.push({name:'あなた',text});
 else say({name:'あなた',text});
 return true;
}

 ],
 open:[

 ],

  '中止エンド ― 星座のない夜'
 ],
 true:[
  '六つの星が静かに瞬く。少し遅れて、同じ光が窓の向こうに灯った。',

  '朝の光がさし込んでも、最後の星は、ふたりの目に残っていた。',
  '真エンド ― 君が見つけた星座'
 ]
};
const titleCaptions={
 first:'今夜も、あの窓に小さな光がまたたいている。',
 open:'消したはずの灯りが、窓の奥で瞬いた。',
 stop:'あの夜の静けさは、いまもこの部屋にある。',
 true:'遠い窓にも、同じ光が灯っている。'
};
let titleTimer;
let endPhase=0;
let endTimer;
let debugEndingReturn=null;
function stopTitleStars(){clearInterval(titleTimer)}
function title(){
 clearTimeout(surpriseTimeout);$('nightSurprise').hidden=true;
 stopTitleStars();
 const mood=st.lastEnding||'unplayed';
 $('titleScreen').dataset.mood=mood;
 $('titleScreen').hidden=false;
 refreshMusic();
 $('game').inert=true;
 const titleStars=$('titleStars');
 titleStars.innerHTML=!st.endingHistory.length?'':`<div class="title-star-pattern" aria-label="六つの星が順にまたたく">${numberSlots.map(slot=>displayHoles[slot]).map(([x,y],i)=>`<span data-star="${i}" style="left:${x}%;top:${y}%">${window.observatoryStars.markup(0,clueColors[i][1])}</span>`).join('')}<span id="titleColorCue" class="color-cue" aria-live="polite"></span></div>`;
 $('titleSubtitle').textContent=titleCaptions[mood]||'君と紡ぐ、ひとつの星座。';
 $('startBtn').disabled=!st.introSeen||Boolean(st.runEnding);
 $('startBtn').classList.toggle('primary',!$('startBtn').disabled);
 $('titleReset').classList.toggle('primary',$('startBtn').disabled);
 const stars=[...$('titleStars').querySelectorAll('[data-star]')];
 if(!stars.length)return;
 const paintTitleStar=(star,lit)=>{
  star.classList.toggle('lit',lit);
  const canvas=star.firstElementChild;
  window.observatoryStars.draw(canvas,0,lit?canvas.dataset.starTint:'#ffffff');
 };
 stars.forEach(star=>paintTitleStar(star,false));
 let litStar=null;
 let beat=0;
 const cue=$('titleColorCue');
 titleTimer=setInterval(()=>{
  if(litStar)paintTitleStar(litStar,false);
  litStar=stars[phoneOrder[beat]];
  if(litStar)paintTitleStar(litStar,true);
  cue.textContent=clueColors[phoneOrder[beat]]?.[0]||'';
  beat=(beat+1)%(phoneOrder.length+2);
 },800);
}
function restart(){
 introRunning=false;
 const {endingHistory,lastEnding,lastObservationReceipt,observationReply}=st;
 st={...defaults(),runId:newObservationId(),endingHistory,lastEnding,lastObservationReceipt,endingDone:endingHistory.length>0,
  observationReply:observationReply!==lastObservationReceipt?observationReply:null};
 selectedItem=null;msgQueue=[];onMsgsDone=null;nextMessage();
 save();play();
}
function play(){
 stopTitleStars();$('titleScreen').hidden=true;$('game').inert=false;
 musicSwitch(true);
 introRunning=!st.introSeen;
 draw();
 if(introRunning){
  st.introSeen=true;save();
  say(['こんせら〜！ 宵空天文台へようこそ！','今日はね、君と一緒に星座を見たいんだ。','ここには、いろんな仕掛けがあるの。遊んだり調べたりすると、小さな星が見つかるよ！','星が出てきたら、その星をタップして拾ってね。拾った星は保管箱に入るよ。','休憩コーナーには、星を飾れる盤があるよ。','どんな星座になるか、楽しみだね！'],()=>{
   introRunning=false;
   syncInvestigation();
   say('まずは本棚を見てみよっか');
  });
 }
}
$('startBtn').onclick=play;
$('titleReset').onclick=()=>{if(!st.introSeen||st.runEnding||confirm('この周の進行をリセットして最初から遊ぶ？'))restart()};
$('homeBtn').onclick=()=>{closeModal();title()};
$('resetBtn').onclick=$('titleReset').onclick;
if(debugMode){
 const prepareDebugStars=()=>{
  clearTimeout(surpriseTimeout);$('nightSurprise').hidden=true;
  msgQueue=[];onMsgsDone=null;nextMessage();
  st.got=Object.keys(starLabels);
  st.puzzleSolved=st.got.slice();
  st.eyeTaken=true;st.npcAtScope=true;st.zone=1;
  if(!isNight())st.clockHour=nightHour;
  draw();
 };
 $('game').classList.add('debug-mode');
 $('debugTools').hidden=false;
 $('titleDebugNote').hidden=false;
 $('debugAllStars').onclick=prepareDebugStars;
 $('debugOpenPhone').onclick=()=>{
  if(st.restored)return;
  prepareDebugStars();
  st.phoneUnlocked=true;phoneHome();
 };
 $('debugTools').querySelectorAll('[data-debug-ending]').forEach(button=>{
  button.onclick=()=>{
   const previousMusic=musicOn;
   $('game').inert=true;
   debugEndingReturn=()=>{
    $('game').inert=false;
    musicSwitch(previousMusic);
    button.focus({preventScroll:true});
   };
   renderEnding(button.dataset.debugEnding,true);
  };
 });
}
function beginEnding(route){
 if(st.endingTransition||st.runEnding)return;
 const playScore=route==='first'&&musicOn;
 st.endingTransition=route;
 save();renderEnding();
 if(playScore)playEndingScore();
}
function renderEnding(route=st.endingTransition,preview=false){
 if(!Object.hasOwn(endingLines,route))return;
 const screen=$('endingScreen');
 const night=$('endRecovery');
 clearTimeout(endTimer);
 internalModalCloser=null;closeModal();musicSwitch(false);stopTitleStars();
 $('titleScreen').hidden=true;
 screen.dataset.route=route;screen.dataset.phase='0';screen.hidden=false;
 $('endNext').hidden=true;$('endTitle').hidden=true;$('endMusic').hidden=true;
 $('songInfo').textContent='';
 $('endConst').innerHTML='';
 endPhase=0;
 if(preview||route==='first'||st.restored){
  finishEnding(route,preview);return;
 }
 const hours=st.clockHour===meteorHour?[meteorHour]:[st.clockHour,23,0,meteorHour];
 let beat=0;
 $('endText').textContent='夜が、更けていく。';
 screen.classList.add('recovering');
 night.hidden=false;
 night.dataset.step='clock';
 function advanceNight(){
  if(beat<hours.length){
   $('endClock').textContent=formatTime(hours[beat++]);
   endTimer=setTimeout(advanceNight,540);
   return;
  }
  st.clockHour=meteorHour;
  night.dataset.step='meteor';
  $('endText').textContent='';
  endTimer=setTimeout(()=>{
   night.dataset.step='light';
   placeTone();
   endTimer=setTimeout(()=>{
    st.restored=true;st.meteorStar=false;
    finishEnding(route);
   },720);
  },800);
 }
 advanceNight();
}
function finishEnding(route,preview=false){
 $('endRecovery').hidden=true;
 $('endingScreen').classList.remove('recovering');
 const figure=route==='stop'?'':endingConstellation(route);
 $('endConst').innerHTML=figure;
 $('endText').textContent=endingLines[route][0];
 $('endNext').hidden=false;$('endNext').disabled=false;
 $('endTitle').textContent=preview?'探索に戻る':'タイトルへ';$('endTitle').hidden=false;
 if(route==='first')$('endMusic').hidden=false;
 if(preview){$('endNext').focus({preventScroll:true});return;}
 if(!st.endingHistory.includes(route))st.endingHistory.push(route);
 st.lastEnding=route;st.runEnding=route;st.endingTransition=null;st.endingDone=true;
 save();draw();
}
$('endNext').onclick=()=>{
 const screen=$('endingScreen');
 const route=screen.dataset.route;
 const lines=endingLines[route];
 endPhase=Math.min(lines.length-1,endPhase+1);
 screen.dataset.phase=String(endPhase);
 $('endText').textContent=lines[endPhase];
 if(route==='first'||route==='true')chime();
 if(route==='open'&&endPhase===2){tone(73,.85,.035);tone(93,.75,.025,.08)}
 if(route==='first'&&endPhase>=2)$('endMusic').hidden=false;
 if(route==='first'&&endPhase===lines.length-2)$('endOmen').classList.add('reveal-omen');
 if(endPhase===lines.length-1)$('endNext').disabled=true;
};
$('endTitle').onclick=()=>{
 $('song').pause();
 $('endingScreen').hidden=true;
 const returnToGame=debugEndingReturn;
 debugEndingReturn=null;
 if(returnToGame)returnToGame();
 else title();
};
async function playEndingScore(){
 const audio=$('song');
 try{await audio.play();$('songInfo').textContent='♪ 星を見上げて';$('endMusic').textContent='♪ 再生中'}
 catch(e){$('songInfo').textContent='';$('endMusic').textContent='♪ 音楽を再生'}
}
$('endMusic').onclick=playEndingScore;
$('song').onended=()=>{$('endMusic').textContent='♪ もう一度聴く'};
window.addEventListener('storage',event=>{if(event.key===key)syncObservation()});
window.addEventListener('pageshow',syncObservation);
window.addEventListener('focus',syncObservation);
window.addEventListener('hashchange',handleObservation);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncObservation()});
draw();title();
if(st.endingTransition)renderEnding();
else handleObservation();
})();
