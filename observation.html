<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>宵空セラのプロフィール</title>
</head>
<body>
  <main><p><a id="profile" href="https://yoizora-sera.beadedcorgi16.chatgpt.site/">宵空セラのプロフィールへ</a></p></main>
  <script>
    const link = document.getElementById('profile');
    const profile = new URL(link.href);
    const attempt = new URLSearchParams(location.hash.slice(1)).get('attempt');
    if (/^[a-f0-9]{32}$/.test(attempt ?? '')) profile.hash = new URLSearchParams({ attempt });
    link.href = profile;
    location.replace(profile);
  </script>
</body>
</html>
